[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flickpond"
version = "0.1.0"
description = "Async video upload and processing platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.10,<3",
  # Pydantic's EmailStr needs this. Hand-rolling an email regex is a
  # well-known way to reject valid addresses.
  "email-validator>=2.2,<3",
  # Declared explicitly. argon2-cffi is already importable as a transitive
  # dependency of minio, but relying on that breaks the day minio drops it.
  "bcrypt>=4.2,<5",
]

[project.optional-dependencies]
# The inherited application and its regression fixtures retain their queue stack.
# V1 artifacts export only the base plus their named V1 extra.
legacy = ["redis>=5,<7", "rq>=2,<3"]
v1-media = ["awslambdaric>=3.1,<4"]
v1-processing = ["awslambdaric>=3.1,<4"]
v1-worker = []
dev = [
  "aiosqlite>=0.21,<1",
  "fakeredis>=2.26,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "pytest-timeout>=2.3,<3",
  "jsonschema>=4,<5",
]
browser = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
include = [
  "app*", "processing*", "media*", "media_engine*", "publisher*",
  "contracts*", "delivery*", "runtime_support*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
  "integration: requires real external services",
  "e2e: requires the full local HTTPS topology",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["app", "processing"]
relative_files = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
