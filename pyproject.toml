[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flickpond"
version = "0.1.0"
description = "Async video upload and processing platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "minio>=7.2,<8",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "urllib3>=2,<3",
]

[project.optional-dependencies]
# The inherited application and its peer API use the complete legacy runtime.
legacy = [
  "alembic>=1.14,<2",
  "bcrypt>=4.2,<5",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "rq>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]
# Owner extras keep API migration and authentication packages out of other images.
v1-media = [
  "alembic>=1.14,<2",
  "awslambdaric>=3.1,<4",
  # Media and the inherited app use bcrypt directly for stored password hashes.
  "bcrypt>=4.2,<5",
  # Pydantic's EmailStr needs this; keep its validation library explicit.
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
]
v1-processing = ["alembic>=1.14,<2", "awslambdaric>=3.1,<4"]
v1-worker = ["awslambdaric>=3.1,<4"]
dev = [
  "aiosqlite>=0.21,<1",
  # The operator CLI reads migration heads before planning a deployment or release.
  "alembic>=1.14,<2",
  "fakeredis>=2.26,<3",
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "pytest-timeout>=2.3,<3",
  "jsonschema>=4,<5",
]
browser = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
include = [
  "app*", "processing*", "media*", "media_engine*", "publisher*",
  "contracts*", "delivery*", "runtime_support*", "legacy*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
  "integration: requires real external services",
  "e2e: requires the full local HTTPS topology",
  "unmeasured: exercises only unmeasured code; skipped by the coverage run for speed",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["app", "processing"]
relative_files = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
