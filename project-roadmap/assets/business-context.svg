<title id="title">FlickPond business context</title><desc id="desc">Maya uses the Publisher CLI and Arun uses the web app. Both clients submit owned video through the published API and receive status and authorised output access. Jules builds the CLI. Sam operates the platform. No internal service boundaries are shown.</desc>
