# Dedicated state-only cloud config. Does not alter local Compose.
x-logging: &logging
  driver: local
  options: {max-size: "5m", max-file: "2"}
services:
  postgres:
    image: ${DC2_POSTGRES_IMAGE:?Reviewed postgres16 immutable digest required}
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MEDIA_MIGRATION_PASSWORD: ${MEDIA_MIGRATION_PASSWORD:?}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD:?}
      PROCESSING_MIGRATION_PASSWORD: ${PROCESSING_MIGRATION_PASSWORD:?}
      PROCESSING_RUNTIME_PASSWORD: ${PROCESSING_RUNTIME_PASSWORD:?}
    command: [postgres, -c, config_file=/etc/postgresql/dc2.conf]
    ports: ["${DC2_STATE_PRIVATE_IP:?}:5432:5432"]
    volumes:
      - /srv/dc2-data/postgres:/var/lib/postgresql/data
      - /opt/dc2/deploy/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-project2.sh:ro
      - /opt/dc2/deploy/aws/state/postgresql.conf:/etc/postgresql/dc2.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: ${DC2_REDIS_IMAGE:?Reviewed Redis7 immutable digest required}
    mem_limit: 128m
    cpus: 0.125
    restart: unless-stopped
    logging: *logging
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?}"}
    command: [sh, -c, 'exec redis-server /etc/redis/dc2.conf --requirepass "$$REDIS_PASSWORD"']
    ports: ["${DC2_STATE_PRIVATE_IP:?}:6379:6379"]
    volumes:
      - /srv/dc2-data/redis:/data
      - /opt/dc2/deploy/aws/state/redis.conf:/etc/redis/dc2.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  nginx:
    image: ${DC2_NGINX_IMAGE:?Reviewed nginx1.28 immutable digest required}
    mem_limit: 128m
    cpus: 0.125
    restart: unless-stopped
    logging: *logging
    ports: ["80:80"]
    environment:
      NGINX_ENVSUBST_FILTER: ^DC2_
      DC2_PUBLIC_HOST: ${DC2_PUBLIC_HOST:?Generated CloudFront hostname required}
      DC2_MEDIA_FQDN: ${DC2_MEDIA_FQDN:?Qualified CloudMap name required}
      DC2_VPC_RESOLVER: ${DC2_VPC_RESOLVER:?VPC CIDR plus2 resolver required}
    volumes:
      - /opt/dc2/frontend:/usr/share/nginx/html:ro
      - /opt/dc2/deploy/aws/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/dc2-aws/origin-gate.conf:/etc/nginx/private/origin-gate.conf:ro
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0700
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
