# The application's routes, shared by the plain-HTTP server in nginx.conf and
# the TLS server a deployment adds in deploy/nginx-tls/. Kept in one file so
# the two cannot drift -- a route that exists on 80 but not 443 is a bug that
# only shows up in production.

include /etc/nginx/app-locations/acme.conf;

# Container healthcheck target. Exempt from auth because the check runs inside
# the container with no credentials, and never redirected, because a redirect
# to https would send it at a certificate that does not match 127.0.0.1.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
}

location /videos/ {
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    # $http_host, not $host: it keeps the port, and MinIO validates the
    # presigned SigV4 signature against the exact host it was signed for.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location / {
    try_files $uri $uri/ /index.html;

    # Revalidate the page and its scripts on every load. Without any
    # Cache-Control, browsers guess a lifetime from Last-Modified -- roughly a
    # tenth of the file's age -- so after a deploy a returning visitor kept
    # running the previous app.js for a day or more without asking. `no-cache`
    # still lets them reuse their copy; it only makes them check the ETag
    # first, which costs a 304 when nothing changed.
    #
    # `expires` rather than `add_header` on purpose: any add_header in a
    # location discards every add_header inherited from the server block,
    # which would silently drop nosniff, X-Frame-Options and Referrer-Policy
    # for the whole frontend.
    expires -1;
}
