name: DAST (isolated current V1 APIs)

on:
  workflow_call:
    inputs:
      required_candidate:
        description: Called by CI for the exact tested candidate
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA of the dispatched ref
        required: true
        type: string
  schedule:
    - cron: "0 3 * * 1"
  # CI owns PR selection and calls this workflow once per candidate.

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  dast:
    name: Authenticated Media and Processing V1 local APIs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DAST_RUN_ID: dast-${{ github.run_id }}-${{ github.run_attempt }}
      DAST_REPORT_DIR: ${{ runner.temp }}/v1-dast-reports
      V1_MOTO_PYTHON: ${{ github.workspace }}/.cache/v1-moto/bin/python
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_DOWNLOADS: never
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify exact source and unique local namespace
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUIRED_CANDIDATE: ${{ inputs.required_candidate }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA'], 'DAST checkout differs from the event SHA'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['REQUIRED_CANDIDATE'] != 'true':
              candidate = os.environ['CANDIDATE_SHA']
              assert re.fullmatch('[0-9a-fA-F]{40}', candidate) and candidate.lower() == source, 'Dispatch on the exact candidate ref and provide candidate_sha'
          run_id = os.environ['DAST_RUN_ID']
          assert re.fullmatch(r'dast-[0-9]+-[0-9]+', run_id), 'Expected a unique DAST run namespace'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f'DAST source: `{source}`. Local namespace: `{run_id}`. Scheduled scans use the default branch.\n')
              stream.write('Target: disposable loopback V1 Gateway/authorizer and generated Media/Processing schemas. AWS/cloud scans: NOT_RUN.\n')
          PY
      - uses: ./.github/actions/python-tools
      - name: Install ffmpeg for the seeded MP4 fixtures
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install locked V1 harness and offline test dependencies
        run: |
          uv sync --locked --extra legacy --extra dev --extra v1-media
          uv venv --allow-existing --python .venv/bin/python .cache/v1-moto
          uv pip install --python "$V1_MOTO_PYTHON" 'moto[server]==5.2.4'
      - name: Verify DAST policy and offline private contracts (not DAST)
        run: |
          .venv/bin/python -m pytest -p scripts.dev.pytest_plugin --offline-fast \
            -m 'not integration and not e2e' tests/dev/test_v1_dast.py tests/contracts \
            tests/media/test_contract_security.py tests/processing/test_contracts.py
      - name: Start unique local PostgreSQL and Moto namespace
        run: .venv/bin/python -m scripts.dev.v1_runtime up --run-id "$DAST_RUN_ID"
      - name: Seed two owners and run bounded authenticated current-V1 ZAP scans
        run: .venv/bin/python -m scripts.dev.v1_dast scan --run-id "$DAST_RUN_ID" --output "$DAST_REPORT_DIR"
      - name: Always tear down this run and remove its local data
        if: always()
        run: .venv/bin/python -m scripts.dev.v1_dast cleanup --run-id "$DAST_RUN_ID" --output "$DAST_REPORT_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1-dast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1-dast-reports/*.json
          if-no-files-found: warn
          retention-days: 14
