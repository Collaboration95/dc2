name: AWS selected-owner preparation (no cloud execution)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: One business owner; peer is never built or deployed
        type: choice
        options: [processing, media]
        default: processing
        required: true

permissions:
  contents: read
concurrency:
  group: aws-prep-${{ github.ref }}-${{ inputs.owner }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OWNER: ${{ inputs.owner }}
      PYTHONPATH: ${{ github.workspace }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
      - run: uv sync --locked --extra dev
      - name: Source tests for selected owner and operational contracts
        run: |
          mkdir -p gates
          case "$OWNER" in processing|media) ;; *) exit 2 ;; esac
          .venv/bin/python -m pytest -p scripts.dev.pytest_plugin --offline-fast \
            -m 'not integration and not e2e' "tests/$OWNER" tests/aws tests/contracts \
            --junitxml=gates/source-tests.xml
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build one immutable amd64 image (never rebuild after gates)
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            -f "deploy/$OWNER.Dockerfile" -t "dc2-$OWNER:gates" .
          echo "CONFIG_ID=$(docker image inspect --format '{{.Id}}' "dc2-$OWNER:gates")" >> "$GITHUB_ENV"
      - name: Execute the exact artifact without network or production secrets
        run: |
          if [ "$OWNER" = processing ]; then
            code="import importlib,shutil; [importlib.import_module(x) for x in ('processing.main','processing.worker','processing.recovery')]; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
          else
            code="import importlib; [importlib.import_module(x) for x in ('media.main','media.recovery')]"
          fi
          timeout 30 docker run --rm --network none --entrypoint python "$CONFIG_ID" -c "$code"
      - name: Hard exact-image gate (zero fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CONFIG_ID }}
          format: json
          output: gates/trivy-private.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Retain selected provenance and the same image for future approved publish
        run: |
          .venv/bin/python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from scripts.aws.artifacts import prepublication_proof
          image, source = os.environ['CONFIG_ID'], os.environ['SOURCE_SHA']
          info = json.loads(subprocess.check_output(['docker','image','inspect',image]))
          counts = ET.parse('gates/source-tests.xml').getroot()
          suites = list(counts) if counts.tag == 'testsuites' else [counts]
          passed = sum(int(s.attrib.get('tests',0))-int(s.attrib.get('failures',0))
                       -int(s.attrib.get('errors',0))-int(s.attrib.get('skipped',0)) for s in suites)
          receipt = {'status':'PASS','config_id':image,'source_sha':source}
          proof = prepublication_proof(owner=os.environ['OWNER'],source=source,inspect=info,
              tests={**receipt,'passed':passed},artifact_test={**receipt,'kind':'offline image imports/encoder'},
              trivy_bytes=Path('gates/trivy-private.json').read_bytes())
          Path('gates/owner-artifact.json').write_text(json.dumps(proof,indent=2))
          Path('gates/trivy-private.json').unlink()
          Path('gates/source-tests.xml').unlink()
          PY
          docker save "$CONFIG_ID" -o gates/selected-image.tar
      - name: Selected-owner publication/deployment preparation after gates
        run: |
          .venv/bin/python -m scripts.aws.release --owner "$OWNER" \
            --artifact gates/owner-artifact.json > gates/publish-deploy-plan.json
          echo 'Production publish/apply DISABLED. Actual account, approval, registry receipt and private operator hooks remain required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-prep-${{ inputs.owner }}-${{ github.sha }}
          path: |
            gates/owner-artifact.json
            gates/publish-deploy-plan.json
            gates/selected-image.tar
          if-no-files-found: error
          retention-days: 14
