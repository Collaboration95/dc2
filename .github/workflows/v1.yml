name: V1 Redis-free local verification

# ci.yml calls this workflow so one run produces the V1 coverage tier its combined gate
# needs. Dispatch defaults to all offline/live checks; images remain an explicit choice.
on:
  workflow_call:
    inputs:
      flow:
        description: a=dependencies/engine, b=clients, c=release/session, all=every flow
        type: string
        default: all
      run_offline:
        description: run the untraced offline control-plane and operational checks
        type: boolean
        default: true
      run_live:
        description: run real local acceptance with browser and source-bound coverage
        type: boolean
        default: true
      auto_images:
        description: select images from changed build inputs when not forced
        type: boolean
        default: true
      images:
        description: also build and verify the three amd64 images (slow)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      flow:
        description: a=dependencies/engine, b=clients, c=release/session, all=every flow
        type: choice
        options: [all, a, b, c]
        default: all
      run_offline:
        description: run offline checks (required for complete local verification)
        type: boolean
        default: true
      run_live:
        description: run live checks (required for complete local verification)
        type: boolean
        default: true
      images:
        description: also build and verify the three amd64 images (slow)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  v1-offline:
    name: V1 offline control-plane and operational checks
    if: ${{ inputs.run_offline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - name: Install locked V1 checks and isolated lint tools (no legacy extra)
        run: |
          uv sync --locked --extra dev
          # Keep the linter separate: its PyYAML must not leak into the no-legacy suite.
          uv venv .cache/v1-cfn-lint
          uv pip install --python .cache/v1-cfn-lint/bin/python 'cfn-lint==1.57.2'
          # The offline suite's real-linter regression must execute, not skip.
          echo "$PWD/.cache/v1-cfn-lint/bin" >> "$GITHUB_PATH"
      - name: Lint the V1 template (render, snapshot freshness, cfn-lint required)
        run: make lint-cfn CFN_LINT_ARGS=--require
      - name: Lint the V1 control scripts and tests
        run: .venv/bin/ruff check scripts/aws/v1 scripts/dev tests/v1
      # coverage-fast excludes unmeasured tests; these untraced invocations are required.
      - name: Offline AWS control-plane suite for the no-legacy environment (network guarded)
        run: make test-aws-v1
      # This test is deliberately integration-marked, but generates request shapes offline.
      - name: Request shapes against the installed AWS CLI's offline skeletons
        run: |
          command -v aws
          .venv/bin/python -m pytest tests/aws/v1/test_deploy.py -k skeleton -q \
            -p scripts.dev.pytest_plugin --require-integration
      - name: Offline V1 operational contracts (network guarded)
        run: make test-v1

  v1-local:
    name: V1 local flows, browser leg and coverage
    if: ${{ inputs.run_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      V1_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      V1_MOTO_PYTHON: ${{ github.workspace }}/.cache/v1-moto/bin/python
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
      FLOW: ${{ inputs.flow || 'all' }}
      # The browser leg is part of complete V1 acceptance and must not be skipped here.
      V1_BROWSER: '1'
      # Emit the v1-integration fragment that ci.yml's combined coverage gate merges.
      V1_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: .local/playwright
          key: v1-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install V1 and isolated emulator tools (no legacy extra)
        run: |
          uv sync --locked --extra dev --extra browser
          uv venv .cache/v1-moto
          uv pip install --python "$V1_MOTO_PYTHON" 'moto[server]==5.2.4'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          # Disposable runner only: browser system libraries need root.
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Start unique PostgreSQL and loopback Moto
        run: make v1-up
      - name: Execute the selected flows against the real PostgreSQL and FFmpeg stack
        run: make verify-v1 FLOW="$FLOW"
      - name: Require complete local acceptance when every flow was requested
        if: ${{ (inputs.flow || 'all') == 'all' }}
        run: |
          .venv/bin/python - <<'PY'
          import glob
          import json
          import os

          path = glob.glob(f".cache/v1-runtime/{os.environ['V1_RUN_ID']}/evidence-*/manifest.json")
          assert len(path) == 1, path
          manifest = json.load(open(path[0]))
          assert manifest["status"] == "PASS", manifest["status"]
          assert manifest["complete_v1_acceptance"] == "PASS", "browser leg or a flow did not run"
          assert manifest["cloud_acceptance"] == "NOT_RUN"
          PY
      - name: Stop only this namespace; retain diagnostic SQL volume
        if: always()
        run: |
          if test -f ".cache/v1-runtime/$V1_RUN_ID/runtime.json"; then make v1-down; fi
      - name: Retain source, image and boundary evidence (no private logs or config)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-local-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/v1-runtime/${{ env.V1_RUN_ID }}/evidence-*/manifest.json
          if-no-files-found: warn
          retention-days: 60
      # A failing test is also named, with its assertion, in the job log (annotations) and in
      # manifest.json's failed_tests. This adds what a log line cannot carry. Everything here
      # went through scripts/dev/v1_redact.py: no cookie values, JWTs or URL query strings.
      # Playwright traces are not kept because they embed headers and presigned URLs verbatim.
      - name: Retain redacted failure detail (junit, screenshot, page state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v1-local-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/v1-runtime/${{ env.V1_RUN_ID }}/evidence-*/*/junit-*.redacted.xml
            .cache/v1-runtime/${{ env.V1_RUN_ID }}/evidence-*/*/failure-*/*/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the coverage fragment for the combined gate
        uses: actions/upload-artifact@v4
        with:
          name: v1-coverage-data
          path: artifacts/coverage/.coverage.v1-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Callers can provide their own classifier with auto_images=false. Standalone dispatch
  # has no auto_images input and leaves images explicit; an unknown automatic diff builds.
  image-paths:
    name: V1 image-affecting paths changed
    if: ${{ inputs.auto_images && !inputs.images }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 -m scripts.ci.v1 images

  # Native amd64 builds plus handler runs under the Lambda Runtime Interface Emulator.
  # Local evidence only; it never contacts a registry or AWS.
  images:
    name: V1 image build and verification
    needs: image-paths
    if: ${{ !cancelled() && (inputs.images || (inputs.auto_images && (needs.image-paths.result != 'success' || needs.image-paths.outputs.changed == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: make v1-images
      - name: Retain the image receipt (config IDs, checks; no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-images-${{ github.sha }}
          path: docs/execution/aws/v1/evidence/local-images-*.json
          if-no-files-found: warn
          retention-days: 60

  v1-result:
    name: V1 requested checks
    if: always()
    needs: [v1-offline, v1-local, image-paths, images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Reject failures and unexpected skips in requested V1 jobs
        env:
          RUN_OFFLINE: ${{ inputs.run_offline }}
          RUN_LIVE: ${{ inputs.run_live }}
          IMAGES: ${{ inputs.images }}
          AUTO_IMAGES: ${{ inputs.auto_images }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci.v1 gate
