name: CI

on:
  push:
    branches: [Main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA of the dispatched ref (full verification)
        required: true
        type: string
  schedule:
    # Complete inherited + V1 regression on the default branch, not an unmerged candidate.
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  UV_PYTHON_DOWNLOADS: never
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
  GH_TOKEN: ${{ github.token }}

jobs:
  classify:
    name: Select verification policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      plan: ${{ steps.policy.outputs.plan }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      security_matrix: ${{ steps.policy.outputs.security_matrix }}
      policy_checks: ${{ steps.policy.outputs.policy_checks }}
      planning: ${{ steps.policy.outputs.planning }}
      lint_and_unit: ${{ steps.policy.outputs.lint_and_unit }}
      frontend: ${{ steps.policy.outputs.frontend }}
      legacy_integration: ${{ steps.policy.outputs.legacy_integration }}
      processing_intake: ${{ steps.policy.outputs.processing_intake }}
      media_integration: ${{ steps.policy.outputs.media_integration }}
      media_service: ${{ steps.policy.outputs.media_service }}
      processing_service: ${{ steps.policy.outputs.processing_service }}
      publisher_https: ${{ steps.policy.outputs.publisher_https }}
      browser_trust: ${{ steps.policy.outputs.browser_trust }}
      v1_offline: ${{ steps.policy.outputs.v1_offline }}
      v1_live: ${{ steps.policy.outputs.v1_live }}
      images: ${{ steps.policy.outputs.images }}
      coverage_gate: ${{ steps.policy.outputs.coverage_gate }}
      security: ${{ steps.policy.outputs.security }}
      dast: ${{ steps.policy.outputs.dast }}
      v1: ${{ steps.policy.outputs.v1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify intended base and exact tested candidate
        id: policy
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/ci/policy.py classify > ci-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ci-policy.json
          if-no-files-found: error
          retention-days: 14

  policy-checks:
    name: CI policy offline tests
    needs: classify
    if: needs.classify.outputs.policy_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/ci -v

  planning:
    name: Planning packet validation
    needs: classify
    if: needs.classify.outputs.planning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/planning/validate_v1_plan.py

  lint-and-unit:
    needs: classify
    if: needs.classify.outputs.lint_and_unit == 'true'
    name: Lint and Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - run: make lint
      - name: Security lint for deployed Python and Publisher sources
        run: >-
          .venv/bin/ruff check --select S
          media processing media_engine contracts delivery runtime_support publisher
      - name: Lint CI helpers (outside inherited lint path)
        run: .venv/bin/ruff check scripts/ci tests/ci
      - run: .venv/bin/python -m scripts.dev.checks coverage-fast
      # The no-legacy V1 offline suite deliberately excludes these AWS2 contracts;
      # coverage-fast excludes unmeasured tooling too. Keep their owner tests here.
      - name: Legacy-only offline operator contracts (network guarded)
        run: >-
          .venv/bin/python -m pytest -q -p scripts.dev.pytest_plugin --offline-fast
          tests/aws/test_cloud_worker.py tests/aws/test_definitions.py
          -m 'not integration and not e2e' --no-cov
      - uses: actions/upload-artifact@v4
        with:
          name: fast-coverage-data
          path: artifacts/coverage/.coverage.fast*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend:
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: .venv/bin/python -m scripts.dev.checks coverage-frontend
      - name: Normalize frontend coverage paths
        run: node frontend/scripts/normalize-lcov.mjs frontend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  fast:
    name: Dev gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [classify, policy-checks, planning, lint-and-unit, frontend, legacy-integration, processing-intake, media-integration, media-service, processing-service, publisher-https, browser-trust, v1-local, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected dev check; validate intentional skips
        env:
          CI_PLAN: ${{ needs.classify.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/policy.py gate --scope dev

  legacy-integration:
    needs: classify
    if: needs.classify.outputs.legacy_integration == 'true'
    name: Legacy real integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flickpond
          POSTGRES_USER: flickpond
          POSTGRES_PASSWORD: flickpond_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flickpond -d flickpond"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RUN_POSTGRES_TESTS: '1'
      POSTGRES_DSN: postgresql://flickpond:flickpond_ci_password@127.0.0.1:5432/flickpond
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: videos
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: .cache/minio
          key: minio-source-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      - name: Fetch pinned MinIO through authenticated gh (runtime lane helper)
        run: |
          test -f scripts/dev/runtime.py || { echo 'Runtime helper pending foundation integration'; exit 2; }
          .venv/bin/python -c 'from scripts.dev.runtime import fetch_minio; fetch_minio()'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: dc2-minio:ci
          cache-from: type=gha,scope=integration-minio
          cache-to: type=gha,scope=integration-minio,mode=max
      - name: Start isolated MinIO and await readiness
        run: |
          docker run -d --name dc2-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            dc2-minio:ci server /data
          .venv/bin/python -m scripts.dev.wait_http http://127.0.0.1:9000/minio/health/live --timeout 60
      - name: Install fixture encoder and migrate isolated legacy database
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          .venv/bin/python -m alembic upgrade head
      - run: make integration-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-coverage-data
          path: artifacts/coverage/.coverage.legacy-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Capture service failure
        if: failure()
        run: docker logs dc2-ci-minio
      - name: Stop only runner-owned MinIO
        if: always()
        run: docker rm -f dc2-ci-minio

  processing-intake:
    needs: classify
    if: needs.classify.outputs.processing_intake == 'true'
    name: Processing worker, recovery and database ownership
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: .cache/minio
          key: minio-source-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      - name: Configure isolated image tags and pinned storage source
        id: images
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          from scripts.dev.runtime import configure, fetch_minio
          env, state = configure('ci-processing')
          fetch_minio()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('processing=' + env['DC2_PROCESSING_IMAGE'] + '\n')
              output.write('minio=' + env['DC2_MINIO_IMAGE'] + '\n')
          PYTHON
      - uses: docker/setup-buildx-action@v3
      - name: Build actual Processing API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/processing.Dockerfile
          load: true
          tags: ${{ steps.images.outputs.processing }}
          cache-from: type=gha,scope=processing
          cache-to: type=gha,scope=processing,mode=max
      - name: Load cached pinned storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: ${{ steps.images.outputs.minio }}
          cache-from: |
            type=gha,scope=browser-minio
            type=gha,scope=integration-minio
            type=gha,scope=processing-minio
          cache-to: type=gha,scope=processing-minio,mode=max
      - name: Install real media fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run real owned PostgreSQL Redis and storage acceptance
        run: .venv/bin/python -m scripts.dev.owned_checks --run-id ci-processing --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: processing-coverage-data
          path: artifacts/coverage/.coverage.processing-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: make logs RUN_ID=ci-processing
        if: failure()
      - run: make down RUN_ID=ci-processing
        if: always()

  media-integration:
    needs: classify
    if: needs.classify.outputs.media_integration == 'true'
    name: Media owned persistence and boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COMPOSE_PROJECT_NAME: dc2-media-ci-${{ github.run_id }}
      RUN_MEDIA_TESTS: '1'
      MEDIA_POSTGRES_DSN: postgresql+asyncpg://media_runtime:dc2_local_media@127.0.0.1:55432/media_db
      MEDIA_MIGRATION_DSN: postgresql+asyncpg://media_migrator:dc2_local_media_migrate@127.0.0.1:55432/media_db
      PROCESSING_SERVICE_TOKEN: ci-only-unused-processing-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - name: Start isolated databases and apply only Media migrations
        run: |
          docker compose -f docker-compose.processing.yml up -d --wait --wait-timeout 120 postgres
          .venv/bin/python -m alembic -c media/alembic.ini upgrade head
      - run: make integration-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: media-coverage-data
          path: artifacts/coverage/.coverage.media-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Capture owned service logs
        if: failure()
        run: docker compose -f docker-compose.processing.yml logs --no-color
      - name: Remove only runner-owned test data
        if: always()
        run: docker compose -f docker-compose.processing.yml down -v

  # Per-service lanes (#199). Each owner's tests, then only that owner's V1 image(s) built and
  # verified, then deploy/v1/check_runtime.py run in the built image. Selected by owner paths in
  # scripts/ci/policy.py (SERVICE_INPUTS); contracts, delivery, runtime_support and the shared
  # build tooling select both. The all-three build in v1-local stays: it proves the images are
  # also isolated from each other.
  media-service:
    needs: classify
    if: needs.classify.outputs.media_service == 'true'
    name: Media service (tests, image, runtime check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev
      - run: make test-media
      - name: Build and verify only Media's V1 image
        run: python3 deploy/v1/build_and_verify.py --only media --out "$RUNNER_TEMP/media-image.json"
      - name: Run check_runtime in the built image
        run: |
          tag="dc2-v1-media:local-$(git rev-parse HEAD | cut -c1-12)"
          docker run --rm --entrypoint python "$tag" /opt/check_runtime.py lambda-api media
      - name: Retain the image receipt (config ID, checks; no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-service-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-image.json
          if-no-files-found: warn
          retention-days: 14

  processing-service:
    needs: classify
    if: needs.classify.outputs.processing_service == 'true'
    name: Processing service (tests, images, runtime check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev
      - run: make test-processing test-media-engine
      # The API image and the finite worker image are both Processing's release unit.
      - name: Build and verify only Processing's V1 images
        run: >-
          python3 deploy/v1/build_and_verify.py --only processing --only worker
          --out "$RUNNER_TEMP/processing-images.json"
      - name: Run check_runtime in the built images
        run: |
          short="$(git rev-parse HEAD | cut -c1-12)"
          docker run --rm --entrypoint python "dc2-v1-processing:local-$short" /opt/check_runtime.py lambda-api processing
          docker run --rm --entrypoint python "dc2-v1-worker:local-$short" /opt/check_runtime.py finite-worker worker
      - name: Retain the image receipt (config IDs, checks; no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processing-service-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/processing-images.json
          if-no-files-found: warn
          retention-days: 14

  publisher-https:
    needs: classify
    if: needs.classify.outputs.publisher_https == 'true'
    name: Independent Publisher HTTPS and cookie persistence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - name: Require real trusted/untrusted HTTPS and persisted Secure cookie
        run: >-
          .venv/bin/python -m pytest -q -p scripts.dev.pytest_plugin
          --require-integration tests/publisher/test_https.py --no-cov
        env:
          PUBLISHER_HTTPS_TEST: '1'

  browser-trust:
    needs: classify
    if: needs.classify.outputs.browser_trust == 'true'
    name: Local HTTPS and browser trust
    runs-on: ubuntu-latest
    # Cold setup/build plus bounded full client acceptance and evidence/cleanup.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: |
            .cache/minio
            .local/playwright
          key: firefox-minio-${{ runner.os }}-${{ hashFiles('uv.lock') }}-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      # Browser install-deps affects this disposable runner only, never developer machines.
      - name: Install browser, NSS and media prerequisites only on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools ffmpeg
          .venv/bin/python -m playwright install-deps firefox
      - name: Record runner capacity without requiring the local scaling VM
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          reply = subprocess.run(
              ['docker', 'info', '--format', '{{json .}}'],
              check=True, capture_output=True, text=True, timeout=10,
          )
          info = json.loads(reply.stdout)
          capacity = {
              'host_cpus': os.cpu_count(),
              'docker_cpus': info['NCPU'],
              'docker_memory_bytes': info['MemTotal'],
              'workers': 1,
          }
          folder = Path('artifacts/ci-trust')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'runner-capacity.json').write_text(json.dumps(capacity, indent=2) + '\n')
          print(json.dumps(capacity))
          PY
      - run: make browser-install RUN_ID=ci-trust
      - name: Prepare pinned storage build
        id: storage
        run: |
          .venv/bin/python - <<'PY'
          import os
          from scripts.dev.runtime import configure, fetch_minio
          env, state = configure('ci-trust')
          fetch_minio()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + env['DC2_MINIO_IMAGE'] + '\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Restore or build pinned storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: ${{ steps.storage.outputs.image }}
          cache-from: |
            type=gha,scope=browser-minio
            type=gha,scope=integration-minio
          cache-to: type=gha,scope=browser-minio,mode=max
      - run: make up RUN_ID=ci-trust
        timeout-minutes: 10
        env:
          DC2_USE_PREBUILT_MINIO: '1'
      - run: make smoke-infra RUN_ID=ci-trust
      # Parent helper seeds a temporary Firefox NSS profile with the project CA.
      # Certificates.Install was ignored under automation; verification remains enabled.
      - run: make browser-trust-smoke RUN_ID=ci-trust
      - name: Complete public API, Publisher CLI and browser acceptance
        timeout-minutes: 16
        run: |
          timeout --signal=TERM --kill-after=30s 15m \
            .venv/bin/python -m scripts.dev.e2e --run-id ci-trust
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('artifacts/ci-trust/e2e-latest.json').read_text())
          report = json.loads(Path(latest['result']).read_text())
          assert latest['status'] == report['status'] == 'PASS'
          assert report['scope'] == 'full'
          for case in ('CT-18-cli', 'CT-18-browser'):
              assert report['cases'][case]['status'] == 'PASS', case
          events = {event['event'] for event in report['events']}
          assert {'browser-hls-decoded', 'browser-mp4-decoded'} <= events
          PY
      # Explicit safe evidence only: no runtime.env, private keys, cookie jars,
      # raw HTTP/CLI output, browser profiles, traces or whole-run directories.
      - name: Retain browser trust and full acceptance evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: |
            artifacts/ci-trust/runner-capacity.json
            artifacts/ci-trust/browser-trust.json
            artifacts/ci-trust/browser-trust.png
            artifacts/ci-trust/e2e-latest.json
            artifacts/ci-trust/e2e-*/result.json
            artifacts/ci-trust/e2e-*/browser-*.png
          if-no-files-found: warn
          retention-days: 7
      - run: make logs RUN_ID=ci-trust
        if: failure()
        timeout-minutes: 1
      - run: make down RUN_ID=ci-trust
        if: always()
        timeout-minutes: 2

  # Real PostgreSQL + FFmpeg, every V1 flow and the real-browser leg. Its coverage
  # fragment is the V1 tier of the combined gate below.
  v1-local:
    name: V1 local verification
    needs: classify
    if: needs.classify.outputs.v1 == 'true'
    uses: ./.github/workflows/v1.yml
    with:
      flow: all
      run_offline: ${{ needs.classify.outputs.v1_offline == 'true' }}
      run_live: ${{ needs.classify.outputs.v1_live == 'true' }}
      auto_images: false
      images: ${{ needs.classify.outputs.images == 'true' }}

  coverage-gate:
    name: Combined backend package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, lint-and-unit, legacy-integration, processing-intake, media-integration, v1-local]
    if: needs.classify.outputs.coverage_gate == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra legacy --extra dev --extra browser
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage-data'
          path: artifacts/coverage
          merge-multiple: true
      - run: >-
          make coverage-report
          COVERAGE_INPUTS='artifacts/coverage/.coverage.fast artifacts/coverage/.coverage.legacy-integration artifacts/coverage/.coverage.processing-integration artifacts/coverage/.coverage.media-integration artifacts/coverage/.coverage.v1-integration'
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            artifacts/coverage/backend.xml
            artifacts/coverage/backend.json
            artifacts/coverage/gate.json
          if-no-files-found: error
          retention-days: 60

  integration:
    name: Full verification
    if: always() && (needs.classify.result != 'success' || needs.classify.outputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [classify, policy-checks, planning, lint-and-unit, frontend, legacy-integration, processing-intake, media-integration, media-service, processing-service, publisher-https, browser-trust, v1-local, secret-scan, coverage-gate, security, dast]
    steps:
      - name: Require successful real integration, trust and package gates
        env:
          LEGACY_RESULT: ${{ needs.legacy-integration.result }}
          PROCESSING_RESULT: ${{ needs.processing-intake.result }}
          MEDIA_RESULT: ${{ needs.media-integration.result }}
          PUBLISHER_RESULT: ${{ needs.publisher-https.result }}
          TRUST_RESULT: ${{ needs.browser-trust.result }}
          V1_RESULT: ${{ needs.v1-local.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
        run: |
          test "$LEGACY_RESULT" = success
          test "$PROCESSING_RESULT" = success
          test "$MEDIA_RESULT" = success
          test "$PUBLISHER_RESULT" = success
          test "$TRUST_RESULT" = success
          test "$V1_RESULT" = success
          test "$COVERAGE_RESULT" = success
      - uses: actions/checkout@v4
      - name: Require every requested full check, including images and scan execution
        env:
          CI_PLAN: ${{ needs.classify.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/policy.py gate --scope full

  dast:
    name: Exact-candidate DAST execution (findings report-only)
    needs: classify
    if: needs.classify.outputs.dast == 'true'
    uses: ./.github/workflows/dast.yml
    with:
      required_candidate: true

  security:
    needs: classify
    if: needs.classify.outputs.security == 'true'
    name: Scan container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.security_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # These are the inherited topology's three artifacts. V1 artifact validation
      # runs in v1.yml; this matrix does not attest to Lambda/Fargate vulnerability scans.
      - name: Require scan selection for new live images
        run: |
          test -f deploy/media.Dockerfile
          test ! -f deploy/worker.Dockerfile || { echo 'Add distinct worker image to scan matrix'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Record the exact loaded candidate image and source
        env:
          IMAGE_REF: ${{ matrix.tag }}
        run: |
          python3 - <<'PYIMAGE'
          import json, os, subprocess
          from pathlib import Path
          digest = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', os.environ['IMAGE_REF']], text=True).strip()
          Path('image-source.json').write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA'], 'image_ref': os.environ['IMAGE_REF'], 'image_id': digest}))
          PYIMAGE
      # Scan the actual loaded candidate. Never weaken the inherited promotion policy.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: json
          output: trivy-findings.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Retain exact candidate scan findings and identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-${{ matrix.name }}-${{ github.run_id }}
          path: |
            image-source.json
            trivy-findings.json
          if-no-files-found: error
          retention-days: 60

  # Unconditional on purpose: no lane selection may skip the one check that stops a leaked
  # credential, and both aggregates require it (scripts/ci/policy.py ALWAYS_JOBS). It scans the
  # whole history, not just the diff, because a key removed in a later commit is still
  # published. Findings fail the job; the allowlist is .gitleaks.toml.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary rather than gitleaks-action: the action needs a licence key for
      # organisation repositories. Version and checksum are pinned together.
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan history (secrets are redacted in the log)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  sonar-config:
    name: Sonar configuration (analysis is advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Report configuration without exposing secrets
        id: config
        env:
          SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
          SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
          SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
        run: |
          python3 - <<'PYSONAR'
          import json, os
          from pathlib import Path
          configured = all(os.environ.get(k) for k in ('SONAR_TOKEN', 'SONAR_PROJECT_KEY', 'SONAR_ORGANIZATION'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('configured=' + str(configured).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Sonar: ' + ('configured; analysis advisory at every tier' if configured else 'NOT_RUN / not configured; no analysis or quality-gate result') + '.\n')
          Path('sonar-configuration.json').write_text(json.dumps({'engine': 'sonar', 'source_sha': os.environ['GITHUB_SHA'], 'configured': configured, 'disposition': 'configured; analysis pending' if configured else 'NOT_RUN / not configured'}))
          PYSONAR
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-configuration-${{ github.run_id }}
          path: sonar-configuration.json
          if-no-files-found: error
          retention-days: 14

  sast:
    name: SonarCloud SAST (advisory)
    if: needs.sonar-config.outputs.configured == 'true' && needs.classify.outputs.mode == 'dev' && (needs.classify.outputs.lint_and_unit == 'true' || needs.classify.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [classify, sonar-config]
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
      SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run advisory source analysis; completed result remains linked in scanner metadata
        id: sonar_analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false
      - name: Record actual Sonar submission disposition
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.sonar_analysis.outcome }}
        run: |
          python3 - <<'PYSCAN'
          import json, os
          from pathlib import Path
          outcome = os.environ['ANALYSIS_OUTCOME']
          status = 'submitted' if outcome == 'success' else ('NOT_RUN' if outcome == 'skipped' else 'error')
          report = {'engine': 'sonar', 'disposition': status, 'step_outcome': outcome,
                    'source_sha': os.environ['GITHUB_SHA'], 'quality_gate': 'advisory; not awaited',
                    'coverage': 'not supplied by this source-only advisory analysis',
                    'results': 'Sonar project dashboard and scanner report-task.txt; submission is not analysis success'}
          Path('sonar-disposition.json').write_text(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Sonar: ' + status + '. Submission does not imply completed analysis or a clean quality gate.\n')
          PYSCAN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-disposition-${{ github.run_id }}
          path: |
            sonar-disposition.json
            .scannerwork/report-task.txt
          if-no-files-found: warn
          retention-days: 14

  sast-full:
    name: SonarCloud full coverage analysis (advisory)
    # Configuration is reported immediately by sonar-config even if these
    # full-only coverage dependencies take time or analysis cannot run.
    if: needs.sonar-config.outputs.configured == 'true' && needs.classify.outputs.mode == 'full'
    needs: [classify, sonar-config, coverage-gate, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
      SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact-source Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
      - name: Download exact-source frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Submit full coverage analysis and await advisory quality result
        id: sonar_analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=backend.xml
      - name: Record actual full Sonar disposition
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.sonar_analysis.outcome }}
        run: |
          python3 - <<'PYSCAN'
          import json, os
          from pathlib import Path
          outcome = os.environ['ANALYSIS_OUTCOME']
          status = 'executed' if outcome == 'success' else ('NOT_RUN' if outcome == 'skipped' else 'error')
          Path('sonar-disposition.json').write_text(json.dumps({'engine': 'sonar', 'disposition': status, 'step_outcome': outcome, 'source_sha': os.environ['GITHUB_SHA'], 'quality_gate': 'awaited; advisory; analysis step remains continue-on-error'}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Full Sonar: ' + status + '. Advisory; wrapper success alone is not a clean scan.\n')
          PYSCAN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-full-disposition-${{ github.run_id }}
          path: |
            sonar-disposition.json
            .scannerwork/report-task.txt
          if-no-files-found: warn
          retention-days: 14
