name: CI

on:
  push:
    branches: [Main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check app tests migrations
      - name: Python unit tests
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml:coverage.xml
      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Coverage, not just the tests: the thresholds in package.json's
      # test:coverage are what stop the player's error paths from quietly
      # losing their tests.
      - run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=lcov
      - name: Normalize frontend coverage paths
        run: node scripts/normalize-lcov.mjs coverage/lcov.info
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sast:
    name: SonarCloud SAST
    runs-on: ubuntu-latest
    needs: [lint-and-unit, frontend]
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
      SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Check SonarCloud configuration
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
        run: echo "::warning::SonarCloud scan skipped; configure SONAR_TOKEN and the SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flickpond
          POSTGRES_USER: flickpond
          POSTGRES_PASSWORD: flickpond_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flickpond -d flickpond"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_POSTGRES_TESTS: '1'
      POSTGRES_DSN: postgresql://flickpond:flickpond_ci_password@127.0.0.1:5432/flickpond
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: videos
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build and start MinIO
        run: |
          docker build -t flickpond-minio:ci -f deploy/dast/minio.Dockerfile .
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            flickpond-minio:ci server /data
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Run integration tests
        run: python -m pytest tests/integration -q

  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: flickpond-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trivy blocks fixable HIGH/CRITICAL vulnerabilities, including ones
  # introduced by the base image; update the image or dependencies rather
  # than weakening this gate.
  security:
    name: Scan container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flickpond-api:ci
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flickpond-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
