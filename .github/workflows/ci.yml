name: CI

on:
  push:
    branches: [Main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  UV_PYTHON_DOWNLOADS: never
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
  GH_TOKEN: ${{ github.token }}

jobs:
  lint-and-unit:
    name: Lint and Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra browser
      - run: make lint
      - run: .venv/bin/python -m scripts.dev.checks coverage-fast
      - uses: actions/upload-artifact@v4
        with:
          name: fast-coverage-data
          path: artifacts/coverage/.coverage.fast*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: .venv/bin/python -m scripts.dev.checks coverage-frontend
      - name: Normalize frontend coverage paths
        run: node frontend/scripts/normalize-lcov.mjs frontend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  fast:
    name: Fast checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [lint-and-unit, frontend]
    steps:
      - name: Require successful fast jobs
        env:
          PYTHON_RESULT: ${{ needs.lint-and-unit.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$PYTHON_RESULT" = success && test "$FRONTEND_RESULT" = success

  legacy-integration:
    name: Legacy real integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flickpond
          POSTGRES_USER: flickpond
          POSTGRES_PASSWORD: flickpond_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flickpond -d flickpond"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RUN_POSTGRES_TESTS: '1'
      POSTGRES_DSN: postgresql://flickpond:flickpond_ci_password@127.0.0.1:5432/flickpond
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: videos
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: .cache/minio
          key: minio-source-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      - name: Fetch pinned MinIO through authenticated gh (runtime lane helper)
        run: |
          test -f scripts/dev/runtime.py || { echo 'Runtime helper pending foundation integration'; exit 2; }
          .venv/bin/python -c 'from scripts.dev.runtime import fetch_minio; fetch_minio()'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: dc2-minio:ci
          cache-from: type=gha,scope=integration-minio
          cache-to: type=gha,scope=integration-minio,mode=max
      - name: Start isolated MinIO and await readiness
        run: |
          docker run -d --name dc2-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            dc2-minio:ci server /data
          .venv/bin/python -m scripts.dev.wait_http http://127.0.0.1:9000/minio/health/live --timeout 60
      - name: Install fixture encoder and migrate isolated legacy database
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          .venv/bin/python -m alembic upgrade head
      - run: make integration-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-coverage-data
          path: artifacts/coverage/.coverage.legacy-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Capture service failure
        if: failure()
        run: docker logs dc2-ci-minio
      - name: Stop only runner-owned MinIO
        if: always()
        run: docker rm -f dc2-ci-minio

  processing-intake:
    name: Processing worker, recovery and database ownership
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: .cache/minio
          key: minio-source-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      - name: Configure isolated image tags and pinned storage source
        id: images
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          from scripts.dev.runtime import configure, fetch_minio
          env, state = configure('ci-processing')
          fetch_minio()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('processing=' + env['DC2_PROCESSING_IMAGE'] + '\n')
              output.write('minio=' + env['DC2_MINIO_IMAGE'] + '\n')
          PYTHON
      - uses: docker/setup-buildx-action@v3
      - name: Build actual Processing API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/processing.Dockerfile
          load: true
          tags: ${{ steps.images.outputs.processing }}
          cache-from: type=gha,scope=processing
          cache-to: type=gha,scope=processing,mode=max
      - name: Load cached pinned storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: ${{ steps.images.outputs.minio }}
          cache-from: |
            type=gha,scope=browser-minio
            type=gha,scope=integration-minio
          cache-to: type=gha,scope=processing-minio,mode=max
      - name: Install real media fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run real owned PostgreSQL Redis and storage acceptance
        run: .venv/bin/python -m scripts.dev.owned_checks --run-id ci-processing --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: processing-coverage-data
          path: artifacts/coverage/.coverage.processing-integration*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: make logs RUN_ID=ci-processing
        if: failure()
      - run: make down RUN_ID=ci-processing
        if: always()

  browser-trust:
    name: Local HTTPS and Firefox trust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra browser
      - uses: actions/cache@v4
        with:
          path: |
            .cache/minio
            .local/playwright
          key: firefox-minio-${{ runner.os }}-${{ hashFiles('uv.lock') }}-20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
      # Browser install-deps affects this disposable runner only, never developer machines.
      - name: Install browser and NSS prerequisites only on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          .venv/bin/python -m playwright install-deps firefox
      - run: make browser-install RUN_ID=ci-trust
      - name: Prepare pinned storage build
        id: storage
        run: |
          .venv/bin/python - <<'PY'
          import os
          from scripts.dev.runtime import configure, fetch_minio
          env, state = configure('ci-trust')
          fetch_minio()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + env['DC2_MINIO_IMAGE'] + '\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Restore or build pinned storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dast/minio.Dockerfile
          build-contexts: minio_source=.cache/minio/20960b6a2ddb9594ee418035b3c7c7fe92ae6a12
          load: true
          tags: ${{ steps.storage.outputs.image }}
          cache-from: |
            type=gha,scope=browser-minio
            type=gha,scope=integration-minio
          cache-to: type=gha,scope=browser-minio,mode=max
      - run: make up RUN_ID=ci-trust
        env:
          DC2_USE_PREBUILT_MINIO: '1'
      - run: make smoke-infra RUN_ID=ci-trust
      # Parent helper seeds a temporary Firefox NSS profile with the project CA.
      # Certificates.Install was ignored under automation; verification remains enabled.
      - run: make browser-trust-smoke RUN_ID=ci-trust
      - run: make logs RUN_ID=ci-trust
        if: failure()
      - run: make down RUN_ID=ci-trust
        if: always()

  coverage-gate:
    name: Combined backend package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-unit, legacy-integration, processing-intake]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev --extra browser
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage-data'
          path: artifacts/coverage
          merge-multiple: true
      - run: >-
          make coverage-report
          COVERAGE_INPUTS='artifacts/coverage/.coverage.fast artifacts/coverage/.coverage.legacy-integration artifacts/coverage/.coverage.processing-integration'
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            artifacts/coverage/backend.xml
            artifacts/coverage/backend.json
            artifacts/coverage/gate.json
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [legacy-integration, processing-intake, browser-trust, coverage-gate]
    steps:
      - name: Require successful real integration, trust and package gates
        env:
          LEGACY_RESULT: ${{ needs.legacy-integration.result }}
          PROCESSING_RESULT: ${{ needs.processing-intake.result }}
          TRUST_RESULT: ${{ needs.browser-trust.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
        run: |
          test "$LEGACY_RESULT" = success
          test "$PROCESSING_RESULT" = success
          test "$TRUST_RESULT" = success
          test "$COVERAGE_RESULT" = success

  security:
    name: Scan container image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: app, file: Dockerfile, tag: flickpond-api:ci}
          - {name: processing, file: deploy/processing.Dockerfile, tag: dc2-processing:ci}
    steps:
      - uses: actions/checkout@v4
      # Phase 1 includes every current app/Processing digest. The backend lanes must
      # extend this matrix for Media and every distinct worker digest before promotion.
      - name: Require scan selection for new live images
        run: |
          test ! -d media || { echo 'Add Media image to scan matrix before integration'; exit 1; }
          test ! -f deploy/worker.Dockerfile || { echo 'Add distinct worker image to scan matrix'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          load: true
          tags: ${{ matrix.image.tag }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
      # Scan the actual loaded candidate. Never weaken the inherited promotion policy.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sast:
    name: SonarCloud SAST
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [coverage-gate, frontend]
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}
      SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Check SonarCloud configuration
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
        run: echo "::warning::SonarCloud scan skipped; configure SONAR_TOKEN and the SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=backend.xml
