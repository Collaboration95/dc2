name: CD

# Deploy, release and teardown of the one persistent, always-on AWS environment (V2-live, #234:
# stack dc2-live). It wraps the existing entry points (scripts.aws.v1.deploy / session / release
# / evidence and deploy/v1/build_and_verify.py) through scripts/ci/cd.sh and reimplements none of
# them; docs/execution/aws/v1/deploy-runbook.md ("Persistent environment") describes the flow.
#
# Every green CI run on Main updates the environment in place (a CloudFormation change set,
# then a release of each owner whose image changed). By hand:
#
#   gh workflow run cd.yml -f operation=preflight
#   gh workflow run cd.yml -f operation=deploy    -f execute=true
#   gh workflow run cd.yml -f operation=release   -f owner=media -f execute=true -f attest_additive=true
#   gh workflow run cd.yml -f operation=teardown  -f execute=true -f confirm=live
#
# A dispatch mutates nothing unless `execute` is true. AWS access is a GitHub OIDC role
# (deploy/aws/v1/github-oidc.yaml) that only the `aws` environment can assume: there is no AWS
# key in GitHub. The environment's state directory lives in a private S3 bucket (the
# repository is public, so a workflow artifact would publish it).

on:
  # The automatic in-place update. The `run` job checks out the exact commit CI tested.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [Main]
  workflow_dispatch:
    inputs:
      operation:
        description: preflight (read-only), deploy, release (one owner) or teardown
        type: choice
        options: [preflight, deploy, release, teardown]
        default: preflight
      environment:
        description: The persistent environment (stack dc2-<name>); 2-16 lowercase letters or digits
        type: string
        default: live
      execute:
        description: >-
          Apply it. Off, deploy prints a review (preflight plus an offline rehearsal), release
          only builds and verifies images, teardown only prints its plan.
        type: boolean
        default: false
      owner:
        description: release only, the service to promote
        type: choice
        options: [none, media, processing]
        default: none
      attest_additive:
        description: >-
          release only. Attest that the previous and the new image both work with this checkout's
          schema head (additive migrations only); the release plan records it as your word.
        type: boolean
        default: false
      bad_candidate:
        description: >-
          release only, with execute. A deliberate fault for the rollback proof: the runner commits
          a Lambda handler with a non-RDS database CA into the candidate (nothing is pushed). The
          release must fail its smoke and be restored automatically; the job passes only if it was restored.
        type: boolean
        default: false
      seed_email:
        description: deploy only, address of the smoke account
        type: string
        default: ops@example.com
      budget_usd:
        description: >-
          cost guard of the first deploy, month-to-date + forecast + planned must stay under
          this. Routine updates are only reported; the stack's AWS Budget alerts instead
        type: string
        default: "30"
      planned_hours:
        description: cost guard, hours the stack is expected to run
        type: string
        default: "3"
      forecast_usd:
        description: >-
          cost guard, expected spend for the rest of the month. Cost Explorer has no history for
          this account, so it cannot forecast and the guard needs your figure
        type: string
        default: "5"
      skip_final_snapshot:
        description: teardown only, delete Aurora without a final snapshot
        type: boolean
        default: false
      confirm:
        description: teardown with execute only, the environment's name typed again
        type: string
        default: ""

# Never two runs at once: the account has one Fargate quota and one Lambda pool, and the
# environment's state is a single journal. Merges queue up; a cancelled run still uploads its
# state (see the last steps).
concurrency:
  group: dc2-aws-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A CI completion on Main is an executed deploy of the default environment.
  CD_OPERATION: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.operation || 'preflight' }}
  CD_ENVIRONMENT: ${{ inputs.environment || 'live' }}
  CD_EXECUTE: ${{ (github.event_name == 'workflow_run' || inputs.execute) && 'true' || 'false' }}
  CD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CD_EVENT: ${{ github.event_name }}
  CD_OWNER: ${{ inputs.owner }}
  CD_ATTEST_ADDITIVE: ${{ inputs.attest_additive && 'true' || 'false' }}
  CD_BAD_CANDIDATE: ${{ inputs.bad_candidate && 'true' || 'false' }}
  CD_SEED_EMAIL: ${{ inputs.seed_email || 'ops@example.com' }}
  CD_BUDGET_USD: ${{ inputs.budget_usd || '30' }}
  CD_PLANNED_HOURS: ${{ inputs.planned_hours || '3' }}
  CD_FORECAST_USD: ${{ inputs.forecast_usd || '5' }}
  CD_SKIP_FINAL_SNAPSHOT: ${{ inputs.skip_final_snapshot && 'true' || 'false' }}
  CD_CONFIRM: ${{ inputs.confirm }}
  # Optional; empty leaves the budget alerts on the stack's SNS topic only.
  CD_BUDGET_EMAIL: ${{ vars.DC2_BUDGET_ALERT_EMAIL }}
  CD_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  UV_PYTHON_DOWNLOADS: never

jobs:
  gate:
    name: Refuse a commit without green CI
    # Only a successful CI run of a push to this repository's Main, never a pull request's run
    # (a fork's branch may also be called Main).
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CD_SHA }}
      - name: Check inputs and the CI result for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CD_REPO: ${{ github.repository }}
          CD_EVENT: ${{ github.event_name }}
        run: scripts/ci/cd.sh gate

  run:
    name: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.operation || 'preflight' }} ${{ inputs.environment || 'live' }}
    needs: gate
    runs-on: ubuntu-latest
    # The environment carries the branch policy that decides who can reach the AWS role.
    environment: aws
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CD_SHA }}
          # Whole history: each owner is released only if its images' inputs changed since the
          # commit it runs from, which `git diff` needs (V2-live).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.17'
      - run: uv sync --locked --extra dev

      # Credentials go into the named profile dc2-gha, not into the environment: the deploy
      # tooling refuses ambient AWS_* credentials. Four hours covers a deploy (50-80 min) with
      # a retry and is the role's MaxSessionDuration.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          aws-profile: dc2-gha
          role-duration-seconds: 14400
          role-session-name: cd-${{ github.run_id }}
          allowed-account-ids: '866865534361'

      - name: Restore the environment's state from the private bucket
        id: state
        if: env.CD_OPERATION != 'preflight'
        run: scripts/ci/cd.sh state-pull

      - name: Preflight (reads only)
        if: env.CD_OPERATION == 'preflight'
        run: scripts/ci/cd.sh preflight

      # The smoke generates its 3 s clip with ffmpeg, which the ubuntu-latest image does not ship
      # (first real deploy, r1018a: "ffmpeg: command not found" after a good deploy).
      - name: Install ffmpeg for the smoke clip
        if: (env.CD_OPERATION == 'deploy' || env.CD_OPERATION == 'release') && env.CD_EXECUTE == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Deploy
        id: deploy
        if: env.CD_OPERATION == 'deploy'
        run: scripts/ci/cd.sh deploy

      - name: Smoke test, upload to playback
        if: env.CD_OPERATION == 'deploy' && env.CD_EXECUTE == 'true'
        run: scripts/ci/cd.sh smoke

      - name: Release
        id: release
        if: env.CD_OPERATION == 'release'
        run: scripts/ci/cd.sh release

      - name: Smoke test after the release, upload to playback
        if: env.CD_OPERATION == 'release' && env.CD_EXECUTE == 'true'
        run: scripts/ci/cd.sh smoke

      - name: Teardown
        if: env.CD_OPERATION == 'teardown'
        run: scripts/ci/cd.sh teardown

      # always() so a failed or cancelled run still saves its journal: a rerun resumes from it.
      # Skipped when the restore itself failed, so an empty directory cannot overwrite the state.
      - name: Save the environment's state to the private bucket
        if: always() && env.CD_OPERATION != 'preflight' && steps.state.outcome == 'success'
        run: scripts/ci/cd.sh state-push

      # Only the reduced, secret-free files in cd-out/public. The repository is public.
      # 60 days (repository maximum is 90) so these receipts outlive the 16 November report and its
      # review; the same horizon is set on the other small, final-claim CI artifacts (#250).
      - name: Upload the redacted results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cd-${{ env.CD_OPERATION }}-${{ env.CD_ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cd-out/public/
          if-no-files-found: warn
          retention-days: 60
