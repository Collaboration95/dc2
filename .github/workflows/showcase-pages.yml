name: Showcase guide

on:
  push:
    branches: [Main]
    paths:
      - 'showcase-prep/**'
      - '.github/workflows/showcase-pages.yml'
  pull_request:
    paths:
      - 'showcase-prep/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate public study guide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build public pages and validate links and exclusions
        run: python3 showcase-prep/publish.py --output _site
      - name: Package the static site
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    name: Publish study guide
    if: github.ref == 'refs/heads/Main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
