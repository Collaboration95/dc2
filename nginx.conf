# Plain HTTP, and the default server for any hostname. This is the whole server
# in local development, where there is no certificate.
#
# A deployment adds a TLS server plus an 80 -> 443 redirect by dropping a file
# into deploy/nginx-tls/ -- see the README there. That directory is empty in a
# fresh checkout on purpose: an unconditional ssl_certificate line pointing at
# a file that does not exist stops nginx from starting, which would break
# `docker compose up` on every machine without a certificate.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 101m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/app-locations/locations.conf;
}

# TLS server and the redirect, when a deployment provides them.
include /etc/nginx/app-tls/*.conf;
