<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .t{font-size:14px;font-weight:bold;fill:#0f172a}
    .k{font-size:11px;font-style:italic;fill:#64748b}
    .s{font-size:12px;fill:#334155}
    .h{font-size:15px;font-weight:bold}
    .ln{stroke:#334155;stroke-width:1.5;fill:none}
    .pill{font-size:12px;font-weight:bold;fill:#78350f}
  </style>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- Media Management context -->
  <rect x="20" y="20" width="410" height="350" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="h" x="40" y="48" fill="#1d4ed8">Media Management</text>

  <rect x="45" y="70" width="150" height="80" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="t" x="120" y="98" text-anchor="middle">Owner</text>
  <text class="s" x="120" y="118" text-anchor="middle">account · role</text>
  <text class="s" x="120" y="135" text-anchor="middle">password hash</text>

  <rect x="230" y="70" width="180" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t" x="320" y="96" text-anchor="middle">Asset</text>
  <text class="k" x="320" y="112" text-anchor="middle">aggregate root</text>
  <text class="s" x="320" y="132" text-anchor="middle">owner_id · source object</text>
  <text class="s" x="320" y="149" text-anchor="middle">type · size</text>
  <text class="s" x="320" y="166" text-anchor="middle">uploaded → submitted</text>
  <path class="ln" d="M195,110 L228,110" marker-end="url(#a)"/>
  <text class="s" x="211" y="102" text-anchor="middle" style="font-size:10px">owns</text>

  <rect x="45" y="205" width="365" height="140" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="t" x="60" y="228" style="font-size:12.5px">Business rules</text>
  <text class="s" x="60" y="252">• Only the owner may request processing of an asset</text>
  <text class="s" x="60" y="274">• Uploads are video types up to 100 MiB</text>
  <text class="s" x="60" y="296">• Playback is granted only after an ownership check</text>
  <text class="s" x="60" y="318">• Sources are deleted only by Media Management</text>

  <!-- Contract between contexts -->
  <text class="t" x="500" y="88" text-anchor="middle" style="font-size:12.5px">Processing contract</text>
  <path d="M432,115 L566,115" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="s" x="500" y="108" text-anchor="middle" style="font-size:11px">SubmitJob</text>
  <text class="s" x="500" y="133" text-anchor="middle" style="font-size:10.5px">asset_id · owner_id</text>
  <text class="s" x="500" y="147" text-anchor="middle" style="font-size:10.5px">source URL · options</text>
  <path d="M566,180 L434,180" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#a)"/>
  <text class="s" x="500" y="173" text-anchor="middle" style="font-size:11px">JobStatus</text>
  <text class="s" x="500" y="198" text-anchor="middle" style="font-size:10.5px">state · output URL</text>
  <text class="s" x="500" y="212" text-anchor="middle" style="font-size:10.5px">failure reason</text>

  <!-- Processing context -->
  <rect x="570" y="20" width="410" height="350" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="h" x="590" y="48" fill="#b45309">Processing</text>

  <rect x="595" y="70" width="190" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="t" x="690" y="96" text-anchor="middle">ProcessingJob</text>
  <text class="k" x="690" y="112" text-anchor="middle">aggregate root</text>
  <text class="s" x="690" y="132" text-anchor="middle">asset_id · owner_id</text>
  <text class="s" x="690" y="149" text-anchor="middle">(references, no FK)</text>
  <text class="s" x="690" y="166" text-anchor="middle">options · attempts</text>

  <rect x="815" y="70" width="145" height="80" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="887" y="98" text-anchor="middle">Output</text>
  <text class="s" x="887" y="118" text-anchor="middle">MP4 + HLS</text>
  <text class="s" x="887" y="135" text-anchor="middle">360p / 480p / 720p</text>
  <path class="ln" d="M785,110 L813,110" marker-end="url(#a)"/>

  <!-- state machine -->
  <rect x="595" y="205" width="365" height="140" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text class="t" x="610" y="228" style="font-size:12.5px">Job lifecycle</text>
  <rect x="610" y="243" width="74" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="pill" x="647" y="262" text-anchor="middle">queued</text>
  <rect x="712" y="243" width="96" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="pill" x="760" y="262" text-anchor="middle">processing</text>
  <rect x="852" y="236" width="80" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text class="pill" x="892" y="254" text-anchor="middle" style="fill:#14532d">done</text>
  <rect x="852" y="272" width="80" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text class="pill" x="892" y="290" text-anchor="middle" style="fill:#7f1d1d">failed</text>
  <path class="ln" d="M684,257 L710,257" marker-end="url(#a)"/>
  <path class="ln" d="M808,253 L850,249" marker-end="url(#a)"/>
  <path class="ln" d="M808,263 L850,283" marker-end="url(#a)"/>
  <path class="ln" d="M852,292 C780,322 680,312 647,273" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text class="s" x="740" y="322" text-anchor="middle" style="font-size:11px">retry (reuses source)</text>
  <text class="s" x="610" y="338" style="font-size:11px">Only a valid claim starts an attempt; one job per submission.</text>

  <text class="s" x="500" y="400" text-anchor="middle">The two parts share identifiers, never tables. Media Management translates an Asset into a SubmitJob request;</text>
  <text class="s" x="500" y="418" text-anchor="middle">completion and failure come back as job status that the web app and the CLI read through the published API.</text>
</svg>
