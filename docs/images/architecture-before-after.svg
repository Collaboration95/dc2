<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .t{font-size:13px;font-weight:bold;fill:#0f172a}
    .s{font-size:11.5px;fill:#334155}
    .h{font-size:15px;font-weight:bold;fill:#0f172a}
    .ln{stroke:#475569;stroke-width:1.5;fill:none}
    .bad{font-size:11.5px;fill:#b91c1c}
  </style>
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- ============ LEFT: baseline ============ -->
  <rect x="10" y="10" width="430" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="h" x="225" y="38" text-anchor="middle">Cert 1 baseline (inherited)</text>

  <rect x="120" y="60" width="210" height="36" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text class="t" x="225" y="83" text-anchor="middle">FlickPond web app</text>

  <rect x="100" y="130" width="250" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text class="t" x="225" y="154" text-anchor="middle">One FlickPond API</text>
  <text class="s" x="225" y="173" text-anchor="middle">identity · upload · jobs · playback</text>

  <rect x="35" y="225" width="150" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="110" y="249" text-anchor="middle">Redis / RQ queue</text>

  <rect x="35" y="300" width="150" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="110" y="326" text-anchor="middle">FFmpeg workers</text>

  <rect x="35" y="375" width="150" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="110" y="401" text-anchor="middle">Recovery task</text>

  <rect x="245" y="285" width="170" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t" x="330" y="310" text-anchor="middle">Shared PostgreSQL</text>
  <text class="s" x="330" y="328" text-anchor="middle">users + jobs tables</text>
  <text class="s" x="330" y="344" text-anchor="middle">jobs FK → users</text>

  <rect x="245" y="385" width="170" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="330" y="409" text-anchor="middle">MinIO storage</text>

  <path class="ln" d="M225,96 L225,128" marker-end="url(#a)"/>
  <path class="ln" d="M170,186 L125,223" marker-end="url(#a)"/>
  <path class="ln" d="M290,186 L320,283" marker-end="url(#a)"/>
  <path class="ln" d="M110,263 L110,298" marker-end="url(#a)"/>
  <path class="ln" d="M185,321 L243,321" marker-end="url(#a)"/>
  <path class="ln" d="M185,392 L243,345" marker-end="url(#a)"/>
  <path class="ln" d="M185,334 L243,398" marker-end="url(#a)"/>

  <text class="bad" x="225" y="455" text-anchor="middle">API, workers and recovery share job models</text>
  <text class="bad" x="225" y="472" text-anchor="middle">and one database: no independent ownership</text>

  <!-- arrow between panels -->
  <path d="M446,250 L466,250" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ============ RIGHT: proposed ============ -->
  <rect x="470" y="10" width="520" height="480" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h" x="730" y="38" text-anchor="middle">Project 2 (proposed)</text>

  <rect x="490" y="56" width="150" height="36" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text class="t" x="565" y="79" text-anchor="middle">FlickPond web app</text>
  <rect x="655" y="56" width="140" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="t" x="725" y="79" text-anchor="middle">Publisher CLI (new)</text>

  <!-- Media context -->
  <rect x="482" y="112" width="232" height="198" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text class="s" x="494" y="304" style="font-weight:bold;fill:#1d4ed8">Media Management service</text>
  <rect x="497" y="138" width="202" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t" x="598" y="163" text-anchor="middle">Media Management API</text>
  <text class="s" x="598" y="182" text-anchor="middle">accounts · assets · delivery</text>
  <rect x="527" y="240" width="142" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="t" x="598" y="261" text-anchor="middle">media_db</text>
  <text class="s" x="598" y="278" text-anchor="middle">own role + migrations</text>
  <path class="ln" d="M598,200 L598,238" marker-end="url(#a)"/>

  <!-- Processing context -->
  <rect x="742" y="112" width="236" height="300" rx="10" fill="#fffbeb" stroke="#d97706" stroke-dasharray="6 4"/>
  <text class="s" x="754" y="128" style="font-weight:bold;fill:#b45309">Processing service</text>
  <rect x="757" y="138" width="206" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t" x="860" y="163" text-anchor="middle">Processing API</text>
  <text class="s" x="860" y="182" text-anchor="middle">jobs · status · outputs</text>
  <rect x="757" y="232" width="96" height="40" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="805" y="257" text-anchor="middle">Redis / RQ</text>
  <rect x="867" y="232" width="96" height="56" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="915" y="256" text-anchor="middle">processing</text>
  <text class="t" x="915" y="273" text-anchor="middle">_db</text>
  <rect x="763" y="318" width="96" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="757" y="312" width="96" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="805" y="331" text-anchor="middle">Workers ×N</text>
  <text class="s" x="805" y="347" text-anchor="middle">FFmpeg</text>
  <rect x="867" y="312" width="96" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="915" y="338" text-anchor="middle">Recovery</text>
  <path class="ln" d="M805,200 L805,230" marker-end="url(#a)"/>
  <path class="ln" d="M915,200 L915,230" marker-end="url(#a)"/>
  <path class="ln" d="M805,272 L805,310" marker-end="url(#a)"/>
  <path class="ln" d="M853,322 L885,290" marker-end="url(#a)"/>
  <path class="ln" d="M915,312 L915,290" marker-end="url(#a)"/>
  <text class="s" x="860" y="398" text-anchor="middle">scaled independently</text>

  <!-- Clients into Media -->
  <path class="ln" d="M565,92 L565,136" marker-end="url(#a)"/>
  <path class="ln" d="M705,92 L640,136" marker-end="url(#a)"/>

  <!-- Contract arrow -->
  <path d="M699,160 L755,160" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M755,180 L701,180" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text class="s" x="722" y="152" text-anchor="middle" style="font-size:10.5px;font-weight:bold">token</text>

  <!-- Object storage -->
  <rect x="497" y="345" width="202" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="598" y="368" text-anchor="middle">Amazon S3 (private)</text>
  <text class="s" x="598" y="386" text-anchor="middle">presigned URLs only</text>
  <path class="ln" d="M560,310 L560,343" marker-end="url(#a)"/>
  <path class="ln" d="M755,345 L701,368" marker-end="url(#a)"/>

  <text class="s" x="730" y="446" text-anchor="middle" style="fill:#047857">Each service owns its data and migrations.</text>
  <text class="s" x="730" y="463" text-anchor="middle" style="fill:#047857">Processing ships without touching Media Management.</text>
</svg>
