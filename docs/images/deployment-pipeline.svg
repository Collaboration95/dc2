<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .t{font-size:12.5px;font-weight:bold;fill:#0f172a}
    .s{font-size:11px;fill:#334155}
    .h{font-size:14px;font-weight:bold;fill:#0f172a}
    .ln{stroke:#475569;stroke-width:1.5;fill:none}
    .st{fill:#eef2ff;stroke:#6366f1;stroke-width:1.3}
    .gate{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
    .aws{fill:#fff7ed;stroke:#ea580c;stroke-width:1.3}
  </style>
  <rect width="1000" height="600" fill="#ffffff"/>

  <text class="h" x="15" y="24">DevSecOps pipeline (GitHub Actions)</text>

  <!-- 8 stages: x = 15 + i*122, width 110 -->
  <rect class="st" x="15"  y="38" width="110" height="58" rx="8"/>
  <text class="t" x="70"  y="62" text-anchor="middle">Pull request</text>
  <text class="s" x="70"  y="80" text-anchor="middle">branch + review</text>

  <rect class="st" x="137" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="192" y="62" text-anchor="middle">Lint + unit</text>
  <text class="s" x="192" y="80" text-anchor="middle">Ruff · pytest · Vitest</text>

  <rect class="st" x="259" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="314" y="62" text-anchor="middle">SAST</text>
  <text class="s" x="314" y="80" text-anchor="middle">SonarCloud</text>

  <rect class="st" x="381" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="436" y="62" text-anchor="middle">Contract +</text>
  <text class="t" x="436" y="78" text-anchor="middle">integration</text>
  <text class="s" x="436" y="91" text-anchor="middle">both services</text>

  <rect class="gate" x="503" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="558" y="62" text-anchor="middle">Image scan</text>
  <text class="s" x="558" y="80" text-anchor="middle">Trivy gate</text>

  <rect class="st" x="625" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="680" y="62" text-anchor="middle">Push to ECR</text>
  <text class="s" x="680" y="80" text-anchor="middle">tag = git SHA</text>

  <rect class="st" x="747" y="38" width="110" height="58" rx="8"/>
  <text class="t" x="802" y="62" text-anchor="middle">Deploy</text>
  <text class="s" x="802" y="80" text-anchor="middle">SSM, per service</text>

  <rect class="st" x="869" y="38" width="116" height="58" rx="8"/>
  <text class="t" x="927" y="62" text-anchor="middle">Smoke test</text>
  <text class="s" x="927" y="80" text-anchor="middle">CLI upload → play</text>

  <path class="ln" d="M125,67 L135,67" marker-end="url(#a)"/>
  <path class="ln" d="M247,67 L257,67" marker-end="url(#a)"/>
  <path class="ln" d="M369,67 L379,67" marker-end="url(#a)"/>
  <path class="ln" d="M491,67 L501,67" marker-end="url(#a)"/>
  <path class="ln" d="M613,67 L623,67" marker-end="url(#a)"/>
  <path class="ln" d="M735,67 L745,67" marker-end="url(#a)"/>
  <path class="ln" d="M857,67 L867,67" marker-end="url(#a)"/>

  <text class="s" x="15" y="118"><tspan font-weight="bold">Blocking:</tspan> failed tests, failed contract checks, fixable HIGH/CRITICAL image findings.</text>
  <text class="s" x="15" y="135"><tspan font-weight="bold">Report-only:</tspan> SonarCloud and OWASP ZAP (weekly and after deploy), with recorded dispositions. AWS access via OIDC, no stored keys.</text>

  <!-- AWS region -->
  <rect x="15" y="158" width="970" height="430" rx="14" fill="#f8fafc" stroke="#ea580c" stroke-width="1.8"/>
  <text class="h" x="35" y="183">AWS · ap-southeast-1 (Singapore) · one VPC</text>
  <path class="ln" d="M802,96 L802,196" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="s" x="810" y="150">pull SHA-tagged images</text>

  <!-- EC2 -->
  <rect x="30" y="198" width="940" height="196" rx="10" fill="#ffffff" stroke="#ea580c" stroke-dasharray="6 4"/>
  <text class="s" x="45" y="216" style="font-weight:bold;fill:#c2410c">EC2 instance · Docker Compose · security group allows 443 only</text>

  <text class="s" x="45" y="238">clients (HTTPS)</text>
  <path class="ln" d="M80,243 L80,256" marker-end="url(#a)"/>
  <rect x="45" y="258" width="130" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text class="t" x="110" y="281" text-anchor="middle">Ingress</text>
  <text class="s" x="110" y="299" text-anchor="middle">nginx + TLS</text>

  <rect x="215" y="246" width="190" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t" x="310" y="276" text-anchor="middle">Media Management</text>
  <text class="s" x="310" y="294" text-anchor="middle">public API · auth · upload</text>
  <text class="s" x="310" y="310" text-anchor="middle">IAM role: sources bucket</text>

  <rect x="450" y="246" width="190" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t" x="545" y="276" text-anchor="middle">Processing API</text>
  <text class="s" x="545" y="294" text-anchor="middle">internal only</text>
  <text class="s" x="545" y="310" text-anchor="middle">IAM role: outputs bucket</text>

  <rect x="690" y="236" width="120" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="750" y="263" text-anchor="middle">Redis / RQ</text>

  <rect x="840" y="236" width="115" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="t" x="897" y="263" text-anchor="middle">Recovery</text>
  <text class="s" x="897" y="296" text-anchor="middle" style="font-size:10px">re-enqueues lost jobs</text>

  <rect x="702" y="322" width="240" height="52" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="696" y="316" width="240" height="52" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="690" y="310" width="240" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t" x="810" y="331" text-anchor="middle">Workers × 1 / 2 / 3</text>
  <text class="s" x="810" y="349" text-anchor="middle">FFmpeg · 2 vCPU cap each</text>

  <!-- Supporting services -->
  <rect x="30" y="420" width="160" height="150" rx="10" class="aws"/>
  <text class="t" x="45" y="442">Supporting services</text>
  <text class="s" x="45" y="466"><tspan font-weight="bold">ECR</tspan> · service images</text>
  <text class="s" x="45" y="486"><tspan font-weight="bold">Parameter Store</tspan> · secrets</text>
  <text class="s" x="45" y="506"><tspan font-weight="bold">SSM</tspan> · deploy, no SSH</text>
  <text class="s" x="45" y="526"><tspan font-weight="bold">CloudWatch</tspan> · logs, metrics</text>
  <text class="s" x="45" y="546"><tspan font-weight="bold">Budgets</tspan> · cost alerts</text>

  <!-- RDS -->
  <rect x="215" y="420" width="425" height="150" rx="10" fill="#ffffff" stroke="#64748b"/>
  <rect x="232" y="436" width="190" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t" x="327" y="460" text-anchor="middle">media_db</text>
  <text class="s" x="327" y="480" text-anchor="middle">role: media_svc</text>
  <text class="s" x="327" y="498" text-anchor="middle">own Alembic history</text>
  <text class="s" x="327" y="516" text-anchor="middle">accounts · assets</text>
  <rect x="434" y="436" width="190" height="96" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t" x="529" y="460" text-anchor="middle">processing_db</text>
  <text class="s" x="529" y="480" text-anchor="middle">role: processing_svc</text>
  <text class="s" x="529" y="498" text-anchor="middle">own Alembic history</text>
  <text class="s" x="529" y="516" text-anchor="middle">jobs · attempts · outputs</text>
  <text class="t" x="427" y="557" text-anchor="middle">Amazon RDS for PostgreSQL · private subnet</text>

  <!-- S3 -->
  <rect x="690" y="420" width="280" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="830" y="443" text-anchor="middle">Amazon S3 · private, encrypted</text>
  <text class="s" x="830" y="463" text-anchor="middle">sources bucket · outputs bucket</text>
  <text class="s" x="830" y="481" text-anchor="middle">Block Public Access · presigned URLs only</text>

  <rect x="690" y="516" width="280" height="54" rx="10" class="aws"/>
  <text class="t" x="830" y="538" text-anchor="middle">IAM</text>
  <text class="s" x="830" y="556" text-anchor="middle">GitHub OIDC role · one role per service</text>

  <!-- arrows -->
  <path class="ln" d="M175,286 L213,286" marker-end="url(#a)"/>
  <path d="M405,280 L448,280" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="s" x="427" y="270" text-anchor="middle" style="font-size:10px">token</text>
  <path class="ln" d="M640,258 L688,258" marker-end="url(#a)"/>
  <path class="ln" d="M750,280 L750,308" marker-end="url(#a)"/>
  <path class="ln" d="M840,258 L812,258" marker-end="url(#a)"/>
  <path class="ln" d="M310,326 L310,434" marker-end="url(#a)"/>
  <path class="ln" d="M545,326 L535,434" marker-end="url(#a)"/>
  <path class="ln" d="M690,345 L626,440" marker-end="url(#a)"/>
  <path class="ln" d="M850,374 L850,418" marker-end="url(#a)"/>
</svg>
