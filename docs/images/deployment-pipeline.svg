<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .t{font-size:13.5px;font-weight:bold;fill:#0f172a}
    .s{font-size:12px;fill:#334155}
    .h{font-size:14px;font-weight:bold;fill:#0f172a}
    .ln{stroke:#475569;stroke-width:1.6;fill:none}
    .st{fill:#eef2ff;stroke:#6366f1;stroke-width:1.3}
  </style>
  <rect width="1000" height="340" fill="#ffffff"/>

  <text class="h" x="15" y="24">Automated pipeline</text>
  <!-- 5 stages: x = 15 + i*196, width 174 -->
  <rect class="st" x="15"  y="38" width="174" height="56" rx="8"/>
  <text class="t" x="102" y="61" text-anchor="middle">Pull request</text>
  <text class="s" x="102" y="80" text-anchor="middle">peer review</text>
  <rect class="st" x="211" y="38" width="174" height="56" rx="8"/>
  <text class="t" x="298" y="61" text-anchor="middle">Build and test</text>
  <text class="s" x="298" y="80" text-anchor="middle">unit · contract · integration</text>
  <rect x="407" y="38" width="174" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t" x="494" y="61" text-anchor="middle">Security scans</text>
  <text class="s" x="494" y="80" text-anchor="middle">code and images</text>
  <rect class="st" x="603" y="38" width="174" height="56" rx="8"/>
  <text class="t" x="690" y="61" text-anchor="middle">Deploy to AWS</text>
  <text class="s" x="690" y="80" text-anchor="middle">one service at a time</text>
  <rect class="st" x="799" y="38" width="186" height="56" rx="8"/>
  <text class="t" x="892" y="61" text-anchor="middle">Smoke test</text>
  <text class="s" x="892" y="80" text-anchor="middle">upload → process → play</text>
  <path class="ln" d="M189,66 L209,66" marker-end="url(#a)"/>
  <path class="ln" d="M385,66 L405,66" marker-end="url(#a)"/>
  <path class="ln" d="M581,66 L601,66" marker-end="url(#a)"/>
  <path class="ln" d="M777,66 L797,66" marker-end="url(#a)"/>
  <path class="ln" d="M690,94 L690,150" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- AWS -->
  <rect x="15" y="152" width="970" height="176" rx="14" fill="#f8fafc" stroke="#ea580c" stroke-width="1.8"/>
  <text class="h" x="35" y="178">AWS (containers; only HTTPS is public)</text>

  <text class="s" x="40" y="214">clients</text>
  <path class="ln" d="M40,226 L90,246" marker-end="url(#a)"/>
  <text class="s" x="40" y="270" style="font-size:11px">HTTPS</text>

  <rect x="95" y="200" width="200" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t" x="195" y="240" text-anchor="middle">Media Management</text>
  <text class="s" x="195" y="260" text-anchor="middle">public API</text>

  <rect x="345" y="200" width="220" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t" x="455" y="232" text-anchor="middle">Processing</text>
  <text class="s" x="455" y="252" text-anchor="middle">internal API · queue</text>
  <text class="s" x="455" y="270" text-anchor="middle">workers (scaled 1 → 3)</text>

  <rect x="615" y="200" width="160" height="96" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text class="t" x="695" y="240" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="695" y="260" text-anchor="middle">one database per service</text>

  <rect x="805" y="200" width="160" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t" x="885" y="240" text-anchor="middle">Object storage</text>
  <text class="s" x="885" y="260" text-anchor="middle">private, presigned URLs</text>

  <path class="ln" d="M295,248 L343,248" marker-end="url(#a)"/>
  <text class="s" x="319" y="238" text-anchor="middle" style="font-size:10.5px">token</text>
  <path class="ln" d="M565,248 L613,248" marker-end="url(#a)"/>
</svg>
