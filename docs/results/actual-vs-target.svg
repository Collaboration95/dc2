<rect x="240" y="142" width="60" height="188" fill="#d55e00"/><text x="270" y="158" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">2.347x</text><text x="270" y="173" text-anchor="middle" font-size="11" fill="#ffffff">PASS</text><text x="270" y="344" text-anchor="middle" font-size="10">AWS V1</text>
<rect x="310" y="99" width="60" height="231" fill="#0072b2"/><text x="340" y="115" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">2.885x</text><text x="340" y="130" text-anchor="middle" font-size="11" fill="#ffffff">PASS</text><text x="340" y="344" text-anchor="middle" font-size="10">local</text>
<line x1="230" y1="162" x2="380" y2="162" stroke="#000" stroke-dasharray="5 3"/>
<text x="305" y="362.0" text-anchor="middle">3 workers (target 2.1x, dashed)</text>
<text x="40" y="378" font-size="10">AWS V1 (orange): 6 clips, one run per cap, 2 vCPU Fargate tasks, r1018b.</text>
<text x="40" y="392" font-size="10">Local pre-V1 (blue): 30 clips, three rotated repeats, Redis/RQ design; not comparable with AWS.</text>
