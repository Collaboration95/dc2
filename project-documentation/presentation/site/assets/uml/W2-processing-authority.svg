class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="52"><path d="M958.12,296 L958.12,368 A3,3 0 0 0 961.12,371 L1310.633,371 A3,3 0 0 0 1313.633,368 L1313.633,303 L1303.633,293 L1139.88,293 L1135.88,235.31 L1131.88,293 L961.12,293 A3,3 0 0 0 958.12,296" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M1303.633,293 L1303.633,301.5 A1.5,1.5 0 0 0 1305.133,303 L1313.633,303 L1303.633,293" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><text x="964.12" y="311.09" fill="#0F172A" font-size="17" textLength="334.513" font-family="'Helvetica'">Per Attempt: 0..1 intent; per Job: 0..* intents.</text><text x="964.12" y="328.09" fill="#0F172A" font-size="17" textLength="252.775" font-family="'Helvetica'">job_id + attempt_id are local FKs.</text><text x="964.12" y="345.09" fill="#0F172A" font-size="17" textLength="265.467" font-family="'Helvetica'">finish(error), retry, cancel, interrupt:</text><text x="964.12" y="362.09" fill="#0F172A" font-size="17" textLength="324.096" font-family="'Helvetica'">stage intent; recovery scans attempt prefix.</text></g><!--link Claim to Life--><!--reverse link Claim to Life--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="43" data-link-type="dependency"><path d="M372.29,155 C416.62,155 461.56,155 508.33,155" style="stroke:#475569;stroke-width:1.4;stroke-dasharray:7,7;" fill="none" id="Claim-backto-Life" codeLine="43"/><polygon points="367.29,155,376.29,159,372.29,155,376.29,151,367.29,155" fill="#475569" style="stroke:#475569;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="379.88" y="147.09" fill="#334155" font-size="17" textLength="116.186" font-family="'Helvetica'">claim() creates;</text></g><!--link Life to Cleanup--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk7" data-source-line="44" data-link-type="dependency"><path d="M853.22,155 C901.38,155 948.06,155 993.89,155" style="stroke:#475569;stroke-width