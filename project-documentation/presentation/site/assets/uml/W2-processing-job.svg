ata-source-line="56"><path d="M6,372.6 L6,427.6 A3,3 0 0 0 9,430.6 L390.612,430.6 A3,3 0 0 0 393.612,427.6 L393.612,379.6 L383.612,369.6 L213.22,369.6 L233.31,292.32 L205.22,369.6 L9,369.6 A3,3 0 0 0 6,372.6" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M383.612,369.6 L383.612,378.1 A1.5,1.5 0 0 0 385.112,379.6 L393.612,379.6 L383.612,369.6" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><text x="12" y="387.69" fill="#0F172A" font-size="17" textLength="366.612" font-family="'Helvetica'">UNIQUE(job_id, attempt_number), number >= 1.</text><text x="12" y="404.69" fill="#0F172A" font-size="17" textLength="330.662" font-family="'Helvetica'">lock_pair(): current; live(): state/token/times.</text><text x="12" y="421.69" fill="#0F172A" font-size="17" textLength="348.633" font-family="'Helvetica'">finish(): 1 primary, optional HLS; attempt keys.</text></g><!--link Attempt to Job--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk5" data-source-line="39" data-link-type="composition"><path d="M406.49,194.1 C433.08,194.1 447.66,194.1 474.24,194.1" style="stroke:#475569;stroke-width:1.4;" fill="none" id="Attempt-to-Job" codeLine="39"/><polygon points="486.24,194.1,480.24,190.1,474.24,194.1,480.24,198.1,486.24,194.1" fill="#475569" style="stroke:#475569;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="414.019" y="189.778" fill="#334155" font-size="17" textLength="25.517" font-family="'Helvetica'">1..*</text><text x="469.121" y="189.619" fill="#334155" font-size="17" font-family="'Helvetica'">1</text></g><!--reverse link Job to Output--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="48" data-link-type="composition"><path d="M731.67,194.1 C757.99,194.1 772.31,194.1 798.63,194.1" style="stroke:#475569;stroke-width:1.4;" fill="none" id="Job-backto-Output" codeLine="48"/><polygon points="719.67,194.1,725.67,198.1,731.67,194.1,725.67,190.1,719.67,194.1" fill="#475569