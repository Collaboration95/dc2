oints="575.022,223.437,586.48,228.021,575.022,232.604,579.605,228.021" fill="#475569" style="stroke:#475569;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="95.837" y1="228.021" x2="581.897" y2="228.021" style="stroke:#475569;stroke-width:1.604;"/><text x="103.857" y="196.133" fill="#334155" font-size="24.063" textLength="299.559" font-family="'Helvetica'">1  accept(): insert / compare</text><text x="103.857" y="220.195" fill="#334155" font-size="24.063" textLength="378.538" font-family="'Helvetica'">(message_id, canonical body hash)</text></g><path d="M80.941,241.771 L158.484,241.771 L158.484,257.813 L147.025,269.271 L77.503,269.271 L77.503,245.208 A3.438,3.438 0 0 1 80.941,241.771" style="stroke:#64748B;stroke-width:1.719;" fill="#EEE"/><rect x="77.503" y="241.771" width="1012.84" height="406.771" fill="none" style="stroke:#64748B;stroke-width:1.719;" rx="3.438" ry="3.438"/><text x="94.691" y="262.328" fill="#0F172A" font-size="25.208" textLength="29.418" font-weight="700" font-family="'Helvetica'">alt</text><text x="175.671" y="263.473" fill="#0F172A" font-size="25.208" textLength="393.019" font-weight="700" font-family="'Helvetica'">[same message_id + same body]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg2" data-source-line="15"><polygon points="108.441,315.104,96.982,319.688,108.441,324.271,103.857,319.688" fill="#475569" style="stroke:#475569;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="101.566" y1="319.688" x2="587.626" y2="319.688" style="stroke:#475569;stroke-width:1.604;stroke-dasharray:2.292,2.292;"/><text x="115.316" y="311.862" fill="#334155" font-size="24.063" textLength="390.581" font-family="'Helvetica'">2a  Duplicate: no projection mutation</text></g><line x1="77.503" y1="330" x2="1090.344" y2="330" style="stroke:#64748B;stroke-width:1.146;stroke-dasharray:2.292,2.292;"/><text x="83.232" y="351.703" fill="#0F172A" font-size="25.208" textLength="429.379" font-weight="700" font-family="'Helvetica'">[same message_id + different body]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg3" data-source-line="17"><polygon points="108.441,387.292,96.982,391.875,108.441,396.458,103.857,391.875" fill="#475569" style="stroke:#475569;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="101.566" y1="391.875" x2="587.626" y2="391.875" style="stroke:#475569;stroke-width:1.604;stroke-dasharray:2.292,2.292;"/><text x="115.316" y="384.049" fill="#334155" font-size="24.063" textLength="465.435" font-family="'Helvetica'">2b  MessageConflict: rollback / batch failure</text></g><line x1="77.503" y1="402.188" x2="1090.344" y2="402.188" style="stroke:#64748B;stroke-width:1.146;stroke-dasharray:2.292,2.292;"/><text x="83.232" y="423.89" fill="#0F172A" font-size="25.208" textLength="217.151" font-weight="700" font-family="'Helvetica'">[new message_id]</text><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg4" data-source-line="19"><polygon points="761.885,459.479,773.344,464.062,761.885,468.646,766.469,464.062" fill="#475569" style="stroke:#475569;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="95.837" y1="464.062" x2="768.76" y2="464.062" style="stroke:#475569;stroke-width:1.604;"/><text x="103.857" y="456.237" fill="#334155" font-size="24.063" textLength="331.694" font-family="'Helvetica'">2c  apply_result(session, body)</text></g><path d="M484.989,482.396 L484.989,639.375 A3.438,3.438 0 0 0 488.427,642.813 L1062.489,642.813 A3.438,3.438 0 0 0 1065.927,639.375 L1065.927,490.417 L1054.469,478.958 L488.427,478.958 A3.438,3.438 0 0 0 484.989,482.396" style="stroke:#D6C27A;stroke-width:0.573;" fill="#FFFBE6"/><path d="M1054.469,478.958 L1054.469,488.698 A1.719,1.719 0 0 0 1056.187,490.417 L1065.927,490.417 L1054.469,478.958" style="stroke:#D6C27A;stroke-width:0.573;" fill="#FFFBE6"/><text x="491.864" y="501.451" fill="#0F172A" font-size="21.771" textLength="515.495" font-family="'Helvetica'">Identity / job / source checks precede version checks.</text><text x="491.864" y="523.222" fill="#0F172A" font-size="21.771" textLength="557.229" font-family="'Helvetica'">Example: live Asset, valid result, stored state_version = 3:</text><text x="491.864" y="544.993" fill="#0F172A" font-size="21.771" textLength="294.066" font-family="'Helvetica'">incoming v2: ignore stale state</text><text x="491.864" y="566.764" fill="#0F172A" font-size="21.771" textLength="423.553" font-family="'Helvetica'">v3, identical semantic content: ignore replay</text><text x="491.864" y="588.535" fill="#0F172A" font-size="21.771" textLength="373.846" font-family="'Helvetica'">v3, DIFFERENT content: reject conflict</text><text x="491.864" y="610.306" fill="#0F172A" font-size="21.771" textLength="457.421" font-family="'Helvetica'">v4: apply only if attempt / transition fences pass</text><text x="491.864" y="632.076" fill="#0F172A" font-size="21.771" textLength="389.675" font-family="'Helvetica'">Semantic content excludes message_id.</text><path d="M5.974,673.75 L5.974,700.104 A3.438,3.438 0 0 0 9.412,703.542 L861.912,703.542 A3.438,3.438 0 0 0 865.349,700.104 L865.349,681.771 L853.891,670.313 L9.412,670.313 A3.438,3.438 0 0 0 5.974,673.75" style="stroke:#D6C27A;stroke-width:0.573;" fill="#FFFBE6"/><path d="M853.891,670.313 L853.891,680.052 A1.719,1.719 0 0 0 855.61,681.771 L865.349,681.771 L853.891,670.313" style="stroke:#D6C27A;stroke-width:0.573;" fill="#FFFBE6"/><text x="115.046" y="692.806" fill="#0F172A" font-size="21.771" textLength="631.067" font-family="'Helvetica'">Inbox + projection share ONE transaction; conflict rolls back both.</text><g class="legend" data-source-line="33"><rect x="131.555" y="740.208" width="847.858" height="32.083" fill="none" style="stroke:#94A3B8;stroke-width:1.146;" rx="3.438" ry="3.438"/><text x="137.284" y="761.819" fill="#0F172A" font-size="20.625" textLength="836.4" font-family="'Helvetica'">Blue = Media-owned. Solid =