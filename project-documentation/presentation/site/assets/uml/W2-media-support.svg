3,367 L340.753,302 L330.753,292 L177.38,292 L173.38,262.23 L169.38,292 L9,292 A3,3 0 0 0 6,295" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M330.753,292 L330.753,300.5 A1.5,1.5 0 0 0 332.253,302 L340.753,302 L330.753,292" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><text x="12" y="310.09" fill="#0F172A" font-size="17" textLength="275.437" font-family="'Helvetica'">apply_result() + validate_transition():</text><text x="12" y="327.09" fill="#0F172A" font-size="17" textLength="225.823" font-family="'Helvetica'">source/owner/attempt checks;</text><text x="12" y="344.09" fill="#0F172A" font-size="17" textLength="313.753" font-family="'Helvetica'">stale state ignored, equivocation rejected.</text><text x="12" y="361.09" fill="#0F172A" font-size="17" textLength="265.999" font-family="'Helvetica'">Inbox + projection commit together.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="57"><path d="M494.57,303.5 L494.57,358.5 A3,3 0 0 0 497.57,361.5 L811.191,361.5 A3,3 0 0 0 814.191,358.5 L814.191,310.5 L804.191,300.5 L658.38,300.5 L654.38,226.27 L650.38,300.5 L497.57,300.5 A3,3 0 0 0 494.57,303.5" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M804.191,300.5 L804.191,309 A1.5,1.5 0 0 0 805.691,310.5 L814.191,310.5 L804.191,300.5" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><text x="500.57" y="318.59" fill="#0F172A" font-size="17" textLength="276.864" font-family="'Helvetica'">tombstone(): Asset + intent + cancel.</text><text x="500.57" y="335.59" fill="#0F172A" font-size="17" textLength="281.596" font-family="'Helvetica'">confirm_cancellation() gates cleanup.</text><text x="500.57" y="352.59" fill="#0F172A" font-size="17" textLength="298.621" font-family="'Helvetica'">cleanup_tombstones(): repeated scans.</text></g><!--link ProcessingProjection to RequestKey--><!--link RequestKey to Cleanup--><!--link Cleanup to StagedObject--><g class="legend" data-source-line="61"><rect x=