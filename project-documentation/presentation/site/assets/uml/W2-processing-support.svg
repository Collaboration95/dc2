.32" fill="#0F172A" font-size="16" textLength="157.438" font-style="italic" font-family="'Helvetica'">«idempotency ledger»</text><text x="352.505" y="82.86" fill="#0F172A" font-size="18" textLength="110.048" font-family="'Helvetica'">RetryRequest</text><line x1="328.81" y1="92" x2="486.248" y2="92" style="stroke:#334155;stroke-width:0.5;"/><text x="333.81" y="109.86" fill="#0F172A" font-size="18" textLength="68.01" font-family="'Helvetica'">id: UUID</text><text x="333.81" y="127.86" fill="#0F172A" font-size="18" textLength="102.041" font-family="'Helvetica'">job_id: UUID</text><text x="333.81" y="145.86" fill="#0F172A" font-size="18" textLength="138.059" font-family="'Helvetica'">request_id: UUID</text><text x="333.81" y="163.86" fill="#0F172A" font-size="18" textLength="138.05" font-family="'Helvetica'">attempt_id: UUID</text></g><!--class AttemptTask--><g class="entity" data-qualified-name="AttemptTask" id="ent0003" data-source-line="29"><rect x="510.9" y="66" width="193.258" height="88" fill="#F1F5F9" style="stroke:#334155;stroke-width:0.5;" rx="3" ry="3"/><text x="511.9" y="83.32" fill="#0F172A" font-size="16" textLength="191.258" font-style="italic" font-family="'Helvetica'">«execution binding ledger»</text><text x="557.014" y="100.86" fill="#0F172A" font-size="18" textLength="101.03" font-family="'Helvetica'">AttemptTask</text><line x1="511.9" y1="110" x2="703.158" y2="110" style="stroke:#334155;stroke-width:0.5;"/><text x="516.9" y="127.86" fill="#0F172A" font-size="18" textLength="138.05" font-family="'Helvetica'">attempt_id: UUID</text><text x="516.9" y="145.86" fill="#0F172A" font-size="18" textLength="118.046" font-family="'Helvetica'">task_name: str</text></g><!--class JobMessaging--><g class="entity" data-qualified-name="JobMessaging" id="ent0004" data-source-line="33"><rect x="728.37" y="66" width="160.313" height="88" fill="#F1F5F9" style="stroke:#334155;stroke-width:0.5;" rx="3" ry="3"/><text x="729.37" y="83.32" fill="#0F172A" font-size="16" textLength="158.313" font-style="italic" font-family="'Helvetica'">«state-version ledger»</text><text x="750.492" y="100.86" fill="#0F172A" font-size="18" textLength="116.068" font-family="'Helvetica'">JobMessaging</text><line x1="729.37" y1="110" x2="887.683" y2="110" style="stroke:#334155;stroke-width:0.5;"/><text x="734.37" y="127.86" fill="#0F172A" font-size="18" textLength="102.041" font-family="'Helvetica'">job_id: UUID</text><text x="734.37" y="145.86" fill="#0F172A" font-size="18" textLength="136.072" font-family="'Helvetica'">state_version: int</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="41"><path d="M6,205 L6,277 A3,3 0 0 0 9,280 L366.059,280 A3,3 0 0 0 369.059,277 L369.059,212 L359.059,202 L191.53,202 L187.53,172.48 L183.53,202 L9,202 A3,3 0 0 0 6,205" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M359.059,202 L359.059,210.5 A1.5,1.5 0 0 0 360.559,212 L369.059,212 L359.059,202" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><text x="12" y="220.09" fill="#0F172A" font-size="17" textLength="280.16" font-family="'Helvetica'">_guard(): create + lock; check owner.</text><text x="12" y="237.09" fill="#0F172A" font-size="17" textLength="342.059" font-family="'Helvetica'">_cancel_locked(): no-Job tombstone persists.</text><text x="12" y="254.09" fill="#0F172A" font-size="17" textLength="305.203" font-family="'Helvetica'">Later submit is a no-op, not resurrection.</text><text x="12" y="271.09" fill="#0F172A" font-size="17" textLength="185.182" font-family="'Helvetica'">Gate is NOT a Job child.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="47"><path d="M448.22,205 L448.22,277 A3,3 0 0 0 451.22,280 L763.836,280 A3,3 0 0 0 766.836,277 L766.836,212 L756.836,202 L611.53,202 L607.53,154.31 L603.53,202 L451.22,202 A3,3 0 0 0 448.22,205" style="stroke:#D6C27A;stroke-width:0.5;" fill="#FFFBE6"/><path d="M756.836,202 L756.836,210.5 A1.5,1.5 0 0 0 758.336,212 L766.836,21