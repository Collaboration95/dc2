<!doctype html><html><head><meta charset="utf-8"><title>W6 reviewed slides</title><style>
body{margin:0;font-family:var(--font-sans,Arial,sans-serif);color:var(--foreground,#0f172a)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
select{min-width:0;flex:1;padding:7px;font:inherit;color:inherit;background:var(--card,#fff);border:1px solid var(--border,#cbd5e1);border-radius:var(--radius,6px)}
button{padding:7px 10px;font:inherit;color:inherit;background:var(--secondary,#f1f5f9);border:1px solid var(--border,#cbd5e1);border-radius:var(--radius,6px);cursor:pointer}
.viewport{overflow:auto;max-width:100%}.viewport img{display:block;width:100%;height:auto}[hidden]{display:none!important}
.viewport.native{height:720px}.viewport.native img{width:1280px;max-width:none}
</style></head><body><div class="controls"><label for="pick">W6 review</label><select id="pick" aria-label="Reviewed slide"><option value="s10-views">s10-views · Each view answers a different design question</option><option value="s12" selected>s12 · Two services expose APIs and own their data</option><option value="s12-processing">s12-processing · Processing separates commands from encoding</option><option value="s13">s13 · Media commits intent; the scheduled repair sends it</option><option value="s14">s14 · Three message flows use four physical queues</option><option value="s15">s15 · Media rechecks the cookie; Processing trusts the Actor</option><option value="s19">s19 · An identical replay is ignored; conflicting v3 is rejected</option></select><button id="zoom" type="button">100% size</button></div><div class="viewport" id="viewer"><img data-slide="s10-views" src="W6-review-qa/s10-views.png" width="1280" height="720" alt="Each view answers a different design question" hidden><img data-slide="s12" src="W6-review-qa/s12.png" width="1280" height="720" alt="Two services expose APIs and own their data"><img data-slide="s12-processing" src="W6-review-qa/s12-processing.png" width="1280" height="720" alt="Processing separates commands from encoding" hidden><img data-slide="s13" src="W6-review-qa/s13.png" width="1280" height="720" alt="Media commits intent; the scheduled repair sends it" hidden><img data-slide="s14" src="W6-review-qa/s14.png" width="1280" height="720" alt="Three message flows use four physical queues" hidden><img data-slide="s15" src="W6-review-qa/s15.png" width="1280" height="720" alt="Media rechecks the cookie; Processing trusts the Actor" hidden><img data-slide="s19" src="W6-review-qa/s19.png" width="1280" height="720" alt="An identical replay is ignored; conflicting v3 is rejected" hidden></div><script>
document.getElementById('pick').onchange=function(){document.querySelectorAll('[data-slide]').forEach(img=>img.hidden=img.dataset.slide!==this.value)};
document.getElementById('zoom').onclick=function(){const full=document.getElementById('viewer').classList.toggle('native');this.textContent=full?'Fit width':'100% size'};
</script></body></html>
