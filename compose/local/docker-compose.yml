x-processing: &processing
  image: ${DC2_PROCESSING_IMAGE:?Run runtime.py env first}
  build:
    context: ${DC2_ROOT}
    dockerfile: deploy/processing.Dockerfile
    labels:
      org.opencontainers.image.revision: ${DC2_BUILD_REVISION:-dirty-unverified}
      dc2.release.source-fingerprint: ${DC2_BUILD_SOURCE_FINGERPRINT:-dirty-unverified}
      dc2.release.source-state: ${DC2_BUILD_SOURCE_STATE:-dirty}

x-media: &media
  image: ${DC2_MEDIA_IMAGE:?Run runtime.py env first}
  build:
    context: ${DC2_ROOT}
    dockerfile: deploy/media.Dockerfile
    labels:
      org.opencontainers.image.revision: ${DC2_BUILD_REVISION:-dirty-unverified}
      dc2.release.source-fingerprint: ${DC2_BUILD_SOURCE_FINGERPRINT:-dirty-unverified}
      dc2.release.source-state: ${DC2_BUILD_SOURCE_STATE:-dirty}

x-media-env: &media-env
  MEDIA_POSTGRES_DSN: ${MEDIA_POSTGRES_DSN:?}
  MEDIA_JWT_SECRET: ${MEDIA_JWT_SECRET:?}
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?}
  MEDIA_PROCESSING_URL: ${MEDIA_PROCESSING_URL:?}
  MEDIA_PROCESSING_SERVICE_TOKEN: ${MEDIA_PROCESSING_SERVICE_TOKEN:?}
  MEDIA_SOURCE_SERVICE_TOKEN: ${MEDIA_SOURCE_SERVICE_TOKEN:?}
  MEDIA_MINIO_ENDPOINT: ${MEDIA_MINIO_ENDPOINT:?}
  MEDIA_MINIO_USE_SSL: ${MEDIA_MINIO_USE_SSL:?}
  MEDIA_MINIO_REGION: ${MEDIA_MINIO_REGION:?}
  MEDIA_MINIO_ACCESS_KEY: ${MEDIA_MINIO_ACCESS_KEY:?}
  MEDIA_MINIO_SECRET_KEY: ${MEDIA_MINIO_SECRET_KEY:?}
  MEDIA_MINIO_SOURCE_BUCKET: ${MEDIA_MINIO_SOURCE_BUCKET:?}
  MEDIA_MINIO_OUTPUT_BUCKET: ${MEDIA_MINIO_OUTPUT_BUCKET:?}
  MEDIA_MINIO_PUBLIC_ENDPOINT: ${MEDIA_MINIO_PUBLIC_ENDPOINT:?}
  MEDIA_MINIO_PUBLIC_USE_SSL: ${MEDIA_MINIO_PUBLIC_USE_SSL:?}

services:
  postgres:
    cpus: 0.125
    mem_limit: 512m
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MEDIA_MIGRATION_PASSWORD: ${MEDIA_MIGRATION_PASSWORD:?}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD:?}
      PROCESSING_MIGRATION_PASSWORD: ${PROCESSING_MIGRATION_PASSWORD:?}
      PROCESSING_RUNTIME_PASSWORD: ${PROCESSING_RUNTIME_PASSWORD:?}
    ports: ["127.0.0.1:${DC2_POSTGRES_PORT}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${DC2_ROOT}/deploy/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-project2.sh:ro
    networks: [media-data, processing-data, host-access]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  media-migrate:
    <<: *media
    command: [python, -m, alembic, -c, media/alembic.ini, upgrade, head]
    environment:
      MEDIA_POSTGRES_DSN: ${MEDIA_MIGRATION_DSN:?}
    networks: [media-data]
    depends_on:
      postgres: {condition: service_healthy}

  media:
    <<: *media
    cpus: 1.0
    mem_limit: 384m
    environment: *media-env
    networks: [media-data, interservice, object-data, edge]
    depends_on:
      media-migrate: {condition: service_completed_successfully}
      storage-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  media-recovery:
    <<: *media
    command: [python, -m, legacy.media_peer.recovery]
    cpus: 0.0625
    mem_limit: 192m
    environment: *media-env
    networks: [media-data, interservice, object-data]
    depends_on:
      media: {condition: service_healthy}

  processing-migrate:
    <<: *processing
    command: [python, -m, alembic, -c, processing/alembic.ini, upgrade, head]
    environment:
      PROCESSING_POSTGRES_DSN: ${PROCESSING_MIGRATION_DSN:?}
    networks: [processing-data]
    depends_on:
      postgres: {condition: service_healthy}

  processing:
    cpus: 0.5
    mem_limit: 256m
    <<: *processing
    environment:
      PROCESSING_POSTGRES_DSN: ${PROCESSING_POSTGRES_DSN:?}
      PROCESSING_SERVICE_TOKEN: ${PROCESSING_SERVICE_TOKEN:?}
      PROCESSING_REDIS_URL: ${PROCESSING_REDIS_URL:?}
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:?}
    ports: ["127.0.0.1:${DC2_PROCESSING_PORT}:8000"]
    networks: [processing-data, interservice, object-data, host-access]
    depends_on:
      processing-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *processing
    command: [python, -m, legacy.processing_rq.worker]
    cpus: 2.0
    mem_limit: 1536m
    stop_grace_period: 60s
    environment:
      PROCESSING_POSTGRES_DSN: ${PROCESSING_POSTGRES_DSN:?}
      PROCESSING_REDIS_URL: ${PROCESSING_REDIS_URL:?}
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:?}
      PROCESSING_MEDIA_URL: ${PROCESSING_MEDIA_URL:?}
      PROCESSING_SOURCE_SERVICE_TOKEN: ${PROCESSING_SOURCE_SERVICE_TOKEN:?}
      PROCESSING_MINIO_ENDPOINT: ${PROCESSING_MINIO_ENDPOINT:?}
      PROCESSING_MINIO_USE_SSL: ${PROCESSING_MINIO_USE_SSL:?}
      PROCESSING_MINIO_REGION: ${PROCESSING_MINIO_REGION:?}
      PROCESSING_MINIO_ACCESS_KEY: ${PROCESSING_MINIO_ACCESS_KEY:?}
      PROCESSING_MINIO_SECRET_KEY: ${PROCESSING_MINIO_SECRET_KEY:?}
      PROCESSING_MINIO_OUTPUT_BUCKET: ${PROCESSING_MINIO_OUTPUT_BUCKET:?}
    networks: [processing-data, interservice, object-data]
    depends_on:
      processing: {condition: service_healthy}
      storage-bootstrap: {condition: service_completed_successfully}

  processing-recovery:
    <<: *processing
    command: [python, -m, legacy.processing_rq.recovery]
    cpus: 0.0625
    mem_limit: 192m
    environment:
      PROCESSING_POSTGRES_DSN: ${PROCESSING_POSTGRES_DSN:?}
      PROCESSING_REDIS_URL: ${PROCESSING_REDIS_URL:?}
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:?}
      PROCESSING_MINIO_ENDPOINT: ${PROCESSING_MINIO_ENDPOINT:?}
      PROCESSING_MINIO_USE_SSL: ${PROCESSING_MINIO_USE_SSL:?}
      PROCESSING_MINIO_REGION: ${PROCESSING_MINIO_REGION:?}
      PROCESSING_MINIO_ACCESS_KEY: ${CLEANUP_MINIO_ACCESS_KEY:?}
      PROCESSING_MINIO_SECRET_KEY: ${CLEANUP_MINIO_SECRET_KEY:?}
      PROCESSING_MINIO_OUTPUT_BUCKET: ${PROCESSING_MINIO_OUTPUT_BUCKET:?}
    networks: [processing-data, object-data]
    depends_on:
      processing: {condition: service_healthy}
      storage-bootstrap: {condition: service_completed_successfully}

  redis:
    cpus: 0.0625
    mem_limit: 128m
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [processing-data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    cpus: 0.125
    mem_limit: 512m
    image: ${DC2_MINIO_IMAGE:?}
    build:
      context: ${DC2_ROOT}
      dockerfile: deploy/dast/minio.Dockerfile
      additional_contexts:
        minio_source: ${DC2_MINIO_SOURCE}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_REGION_NAME: ${MINIO_REGION:?}
      MINIO_BROWSER: "off"
    command: [server, /data]
    volumes: [object-data:/data]
    networks: [object-data]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-bootstrap:
    <<: *processing
    command: [python, /bootstrap/storage.py]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      SOURCE_BUCKET: ${SOURCE_BUCKET:?}
      OUTPUT_BUCKET: ${OUTPUT_BUCKET:?}
      MINIO_REGION: ${MINIO_REGION:?}
      MEDIA_MINIO_ACCESS_KEY: ${MEDIA_MINIO_ACCESS_KEY:?}
      MEDIA_MINIO_SECRET_KEY: ${MEDIA_MINIO_SECRET_KEY:?}
      PROCESSING_MINIO_ACCESS_KEY: ${PROCESSING_MINIO_ACCESS_KEY:?}
      PROCESSING_MINIO_SECRET_KEY: ${PROCESSING_MINIO_SECRET_KEY:?}
      CLEANUP_MINIO_ACCESS_KEY: ${CLEANUP_MINIO_ACCESS_KEY:?}
      CLEANUP_MINIO_SECRET_KEY: ${CLEANUP_MINIO_SECRET_KEY:?}
      PUBLIC_URL: https://localhost:${DC2_HTTPS_PORT}
      CA_FILE: /tls/ca.crt
    volumes:
      - ${DC2_ROOT}/deploy/minio/bootstrap.py:/bootstrap/storage.py:ro
      - ${DC2_RUN_DIR}/tls/ca.crt:/tls/ca.crt:ro
    networks: [object-data, edge]
    depends_on:
      minio: {condition: service_healthy}

  nginx:
    cpus: 0.0625
    mem_limit: 128m
    image: nginx:1.28-alpine
    environment:
      NGINX_ENVSUBST_FILTER: ^DC2_
      DC2_SOURCE_BUCKET: ${SOURCE_BUCKET:?}
      DC2_OUTPUT_BUCKET: ${OUTPUT_BUCKET:?}
    ports: ["127.0.0.1:${DC2_HTTPS_PORT}:443"]
    volumes:
      - ${DC2_ROOT}/deploy/nginx/local.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DC2_ROOT}/frontend:/usr/share/nginx/html:ro
      - ${DC2_RUN_DIR}/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ${DC2_RUN_DIR}/tls/server.key:/etc/nginx/tls/server.key:ro
    networks: [edge, object-data]
    depends_on:
      minio: {condition: service_healthy}
      media: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  object-data:

# Media joins media-data/interservice/object-data/edge. Workers use signed HTTP
# source reads; their output principal can only write, and recovery can list/delete.
networks:
  media-data: {internal: true}
  processing-data: {internal: true}
  interservice: {internal: true}
  object-data: {internal: true}
  edge:
  # Docker suppresses host port bindings for internal-only endpoints. This bridge
  # enables the explicit loopback diagnostic ports on PG/P API; no worker joins.
  host-access:
